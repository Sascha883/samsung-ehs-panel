<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Samsung EHS – Bedieneinheit (HMI-800-Menü) – Home Assistant</title>
<!--
  SAMSUNG-EDITION (EHS Sentinel) – Menüführung 1:1 vom Bosch-HMI-800-Panel,
  Farben nach dem Samsung-Bedienteil, Daten aus der EHS-Sentinel-HACS-Integration
  (Präfix samsung_ehssentinel_). Bosch-Menüpunkte ohne Samsung-Gegenstück werden
  automatisch ausgeblendet; zusätzlich Service → Anlageneinstellungen → Samsung FSV-Einstellungen.
  Datei z.B. als /config/www/samsung-ehs.html ablegen, URL /local/samsung-ehs.html

  Ursprung: Bosch HMI 800 / UI 800 – Nachbau der Bedieneinheit für Home Assistant
  Optik und Menüführung nach dem Bosch-Online-Simulator (bosch-homecomfort.com/hmi800, CS5800i AW)
  Servicemenü: ≡ auf der Startseite 2 Sekunden gedrückt halten
  Datenquelle: EMS-ESP (BBQKees) über MQTT-Discovery, Standard-Entitätsnamen
  (boiler_* = Wärmepumpe, thermostat_* = UI 800 / BC400)

  Installation (empfohlen): im EMS-ESP Manager (ab v1.6.0) enthalten –
    Sidebar-Eintrag „Bosch HMI 800“, Zuordnung und Token werden in Home Assistant
    gespeichert, neue Versionen im Dashboard „EMS-ESP“ hochladen.

  Installation ohne Manager:
    1. Datei nach /config/www/bosch-ui800.html kopieren
    2. HA: Einstellungen → Dashboards → Dashboard hinzufügen → "Webseite"
       URL: /local/bosch-ui800.html
    → Das Panel nutzt automatisch die Anmeldung von Home Assistant.
    Alternativ direkt im Browser öffnen: http://<ha>:8123/local/bosch-ui800.html
    (dann unten im Script HA_TOKEN eintragen oder im Menü → Verbindung).

  Entitäten anpassen: Menü → Panel-Einstellungen → Entitäten-Zuordnung
  oder unten im Block ENTITY_OVERRIDES fest eintragen.
-->
<style>
/* ===== Bosch HMI 800 Optik (nach bosch-homecomfort.com/hmi800) ===== */
:root{
  /* Samsung-Bedienteil: helles Display, Samsung-Blau als Akzent */
  --bg:#f5f7fa; --txt:#2b2f36; --dim:#6b7380; --dim2:#9aa1ab; --sep:#e1e5eb; --line:#d5dae1;
  --acc:#3a95e6; --ok:#2e9d5b; --warn:#d98a00; --err:#e0453a; --hl:#e8edf4;
  --red:#e0573b; --blue:#3a95e6; --teal:#2a9d8f; --frame:#dfe3e8;
  --rainbow:linear-gradient(90deg,#3a95e6 0%,#1f6fc0 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--frame);color:var(--txt);overflow:hidden;
  font-family:"SamsungOne","Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;font-weight:400}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--frame)}
#dev{width:800px;height:480px;position:relative;background:var(--bg);overflow:hidden;transform-origin:center center}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;z-index:50}
svg{overflow:visible}
/* Kopfzeile mit Bosch-Regenbogenlinie */
.hdr{height:76px;position:relative;margin:0 66px}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rainbow)}
.hdr .l{position:absolute;left:14px;top:14px;display:flex;gap:10px}
.hdr .r{position:absolute;right:14px;top:14px}
.hdr .c{position:absolute;left:50%;top:14px;height:44px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font-size:22px;white-space:nowrap}
.hdr .ttl{font-size:21px;letter-spacing:.2px;display:flex;align-items:center;gap:10px;max-width:440px;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.ib:active{background:#e3e8ef}
.ib svg{width:30px;height:30px}
/* Startseite */
.car{position:absolute;top:96px;left:0;right:0;height:300px}
.car .inner{position:absolute;left:66px;right:66px;top:0;bottom:0;overflow:hidden}
.track{display:flex;height:100%;transition:transform .35s ease}
.slot{flex:0 0 334px;height:100%;position:relative;display:flex;flex-direction:column}
.slot + .slot::before{content:"";position:absolute;left:0;top:10px;bottom:16px;width:1px;background:var(--line)}
.tile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;min-width:0}
.tile:active{background:#eaf0f7}
.slot .tile + .tile::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;background:var(--line)}
.tile .lbl{font-size:23px;letter-spacing:.2px;text-align:center;line-height:1.25}
.tile .sub{font-size:17px;border-top:1px solid #c9cfd7;padding-top:6px;margin-top:6px;min-width:120px;text-align:center}
.tile .big{font-size:96px;font-weight:300;line-height:1;display:flex;align-items:flex-start}
.tile .big .d{font-size:44px;display:flex;flex-direction:column;align-items:flex-start;line-height:.9;margin-left:4px}
.tile .top{display:flex;flex-direction:column;align-items:center;font-size:17px;margin-bottom:6px}
.tile .top .m{display:inline-flex;align-items:flex-end;gap:6px;font-size:18px}
.tile svg.ic{width:36px;height:36px}
.tile.zone{background:linear-gradient(180deg,#fff,#eef1f5);margin:8px 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line)}
.tile.zone .big{color:var(--acc)}
.tile.bw{background:linear-gradient(180deg,#3a95e6,#1f6fc0);color:#fff;margin:8px 10px;border-radius:6px}
.tile.bw .sub{border-top-color:rgba(255,255,255,.55)}
.tile.bw:active{filter:brightness(.95)}
.slot .tile.zone + .tile::before,.slot .tile.bw + .tile::before{display:none}
.homeline{position:absolute;left:66px;right:66px;top:400px;height:1px;background:var(--line)}
.arr{position:absolute;top:110px;width:48px;height:80px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.arr svg{width:24px;height:42px}
.arr.l{left:20px}.arr.r{right:20px}
.dots{position:absolute;top:438px;left:0;right:0;display:flex;justify-content:center;gap:14px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#c4cad3}
.dots i.on{background:var(--acc);width:12px;height:12px}
/* Bildschirme */
.scr{position:absolute;inset:0;background:var(--bg)}
.body{position:absolute;top:80px;left:66px;right:66px;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#b5bcc6 transparent;padding:0 0 12px}
.body::-webkit-scrollbar{width:4px}.body::-webkit-scrollbar-thumb{background:#b5bcc6;border-radius:2px}
.list{margin:6px 20px 0}
.row{min-height:66px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--sep);font-size:21px;cursor:pointer;gap:14px;line-height:1.25}
.row:active{background:var(--hl)}
.row .v{color:var(--txt);display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:20px}
.row .v.d{color:var(--dim)}
.row .k{min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .k small{display:block;font-size:13px;color:var(--dim2);margin-top:2px}
.row.ro{cursor:default}.row.ro:active{background:none}
.row.miss{opacity:.4}
.row.sec{min-height:44px;font-size:15px;color:var(--dim);letter-spacing:.6px;cursor:default;padding-top:16px;border-bottom:1px solid var(--sep)}
.row.sec:active{background:none}
.chev{width:12px;height:20px;opacity:.9}
.tog{width:48px;height:26px;border-radius:13px;position:relative;flex:0 0 auto;background:#c9cfd7}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--acc)}.tog.on::after{left:25px}
.rad{width:24px;height:24px;border-radius:50%;flex:0 0 auto;background:#c9cfd7;position:relative}
.rad.on{background:var(--acc)}.rad.on::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.note{font-size:16px;color:var(--dim);padding:14px 12px;line-height:1.45}
.warnbox{border-left:3px solid var(--warn);color:#8a5a00;padding:10px 14px;margin:12px 20px;font-size:16px;line-height:1.4;background:#fff6e5}
/* Heizen / Warmwasser – Bosch-Ansicht mit Rolle */
.tabs{position:absolute;top:96px;left:0;right:0;display:flex;justify-content:center;gap:30px;font-size:21px}
.tabs span{cursor:pointer;padding:2px 2px 4px}
.tabs span.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.hroll{position:absolute;top:150px;left:66px;right:66px;height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden}

.hroll .navl,.hroll .navr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:70px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hroll .navl{left:0}.hroll .navr{right:0}
.hroll .navl.off{opacity:.25}.hroll .navr.off{opacity:.25}
.stline{position:absolute;top:340px;left:66px;right:66px;text-align:center;font-size:20px;cursor:pointer;color:var(--txt)}
.bline{position:absolute;left:66px;right:66px;top:400px;height:1px;background:var(--line)}
.bar{position:absolute;left:66px;right:66px;top:404px;height:70px;display:flex;align-items:center;justify-content:space-between;font-size:21px;padding:0 20px}
.bar span{cursor:pointer;display:flex;align-items:center;gap:8px}
.bar .info{cursor:default;gap:14px;color:var(--txt)}
/* Werteingabe (Rolle) */
.vroll{position:absolute;top:96px;left:0;right:0;height:250px;display:flex;align-items:center;justify-content:center}
.vroll .col{position:relative;width:420px;height:250px;overflow:hidden;cursor:ns-resize;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%)}
.vroll .v{position:absolute;left:0;right:0;text-align:center;font-weight:300;line-height:1;white-space:nowrap}
.vroll .v.c{top:75px;font-size:100px}
.vroll .v.p{top:-20px;font-size:80px;opacity:.55}
.vroll .v.n{top:190px;font-size:80px;opacity:.55}
.vroll .ud{position:absolute;left:calc(50% + 150px);top:72px;display:flex;flex-direction:column;gap:46px}
.vroll .ud div{width:44px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.vroll .unit{font-size:15px;color:var(--dim);position:absolute;bottom:-24px;left:0;right:0;text-align:center}
.edhint{position:absolute;left:66px;right:66px;top:400px;border-top:1px solid var(--line);padding:16px 20px;font-size:15px;color:var(--dim);display:flex;justify-content:space-between}
/* Systemübersicht */
.so{position:absolute;top:96px;left:66px;right:66px;height:300px}
.so .info{position:absolute;left:20px;top:10px;font-size:19px;color:var(--txt)}
.so .info .k{font-size:18px;margin-top:20px}
.so .info .v{display:flex;align-items:center;gap:10px;font-size:23px;margin-top:6px;cursor:pointer;width:200px}
.so .info .v .chev{margin-left:auto}
.so .info .icons{display:flex;gap:16px;margin-top:8px;color:var(--dim)}
.so svg.sch{position:absolute;left:220px;top:0}
.bar .aux{opacity:.35}.bar .aux.on{opacity:1}
/* Energie */
.etabs{position:absolute;top:92px;left:0;right:0;display:flex;justify-content:center;gap:26px;font-size:19px}
.etabs span{cursor:pointer;padding-bottom:3px}.etabs span.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.en{position:absolute;top:130px;left:96px;right:96px;display:flex;align-items:center;gap:44px;height:260px}
.leg div{display:flex;align-items:center;gap:14px;font-size:21px;margin:9px 0;width:330px}
.leg i{width:14px;height:14px;border-radius:50%}
.leg b{font-weight:400;margin-left:auto;color:var(--txt);font-size:18px}
/* Außentemperatur-Grafik */
.chart{position:absolute;top:92px;left:66px;right:66px;height:300px}
/* Overlays / Popups */
#ovl{position:absolute;inset:0;z-index:40;display:none}
.pop{position:absolute;left:90px;right:90px;top:40px;min-height:260px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px rgba(20,30,50,.18);padding:28px 34px;font-size:19px;line-height:1.5}
.pop .x{position:absolute;right:0;top:0;width:52px;height:52px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:30px;font-weight:300}
.pop h3{padding-right:44px;margin:0 0 14px;font-weight:400;font-size:22px;display:flex;gap:12px;align-items:center}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2f36;color:#fff;border-radius:22px;padding:10px 20px;font-size:17px;z-index:60;display:none;max-width:700px;text-align:center}
.saver{position:absolute;inset:0;background:#000;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#666}
.saver .clk{font-size:90px;font-weight:300;color:#444}
.kbd textarea,.kbd input{width:100%;background:#fff;border:1px solid #c9cfd7;color:var(--txt);font:inherit;font-size:16px;padding:10px;user-select:text}
.kbd input{height:46px}
.sbar{position:relative;height:16px;flex:1;background:#e3e8ef;margin:0 10px 0 4px;min-width:120px}
.sbar i{position:absolute;top:0;bottom:0;background:var(--acc)}
.sbar b{position:absolute;top:18px;font-size:11px;color:var(--dim);font-weight:400;transform:translateX(-50%)}
.sday{width:42px;flex:none}
.tbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:40px;border:1px solid #c9cfd7;font-size:22px;cursor:pointer}
.pill{font-size:13px;padding:2px 8px;border-radius:10px;background:#e3f4ea;color:#2d7a4b}
.pill.no{background:#fde8e6;color:#b3261e}.pill.dm{background:#fff3d6;color:#8a5a00}
.btns{position:absolute;bottom:16px;left:86px;right:86px;display:flex;gap:20px}
.btn{flex:1;height:52px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid #c9cfd7;border-radius:6px;background:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:active{filter:brightness(.94)}
.body.kbd{bottom:84px}
.lfil{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--sep)}
.lfil span{font-size:15px;padding:5px 12px;border-radius:14px;border:1px solid var(--line);cursor:pointer;background:#fff}
.lfil span.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lfil .sp{flex:1;border:0;padding:0;background:none;cursor:default}
.logrow{display:flex;gap:10px;padding:6px 12px;border-bottom:1px solid var(--sep);font-size:14px;line-height:1.35}
.logrow .lt{color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.logrow .ll{flex:none;width:16px;font-weight:700;text-align:center}
.logrow .lm{min-width:0;word-break:break-word;white-space:pre-wrap;user-select:text}
.logrow .ln{color:var(--dim);font-size:12px;display:block}
.logrow.WARNING .ll{color:var(--warn)}.logrow.ERROR .ll,.logrow.CRITICAL .ll{color:var(--err)}.logrow.ERROR .lm{color:var(--err)}.logrow.DEBUG .lm{color:var(--dim)}
.pkt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:3px 12px;border-bottom:1px solid var(--sep);word-break:break-all;user-select:text}
.portrait .body.kbd{bottom:calc(84px + var(--sb))}
.abs{position:absolute;top:110px;left:66px;right:66px;display:flex}
.abs .tile{height:240px}
.abs .tile + .tile{border-left:1px solid var(--line)}
.abs .tile.sel .lbl{color:var(--acc)}

/* ===== Hochformat / iPhone 17 (402 × 874 pt) ===== */

<body>
<div id="stage"><div id="dev">
  <div id="root"></div>
  <div id="ovl"></div>
  <div class="toast" id="toast"></div>
  <div id="dim"></div>
</div></div>

<script>
/* =====================================================================
   1) KONFIGURATION
   ===================================================================== */
// ── Home-Assistant-Zugang ─────────────────────────────────────────────
// HA_TOKEN: Long-Lived Access Token (HA → Profil → Sicherheit → Token erstellen).
//   Leer lassen = Anmeldung von HA mitbenutzen (nur als Webseiten-Dashboard unter /local/…).
//   Eingetragen = direkter WebSocket, funktioniert auch außerhalb von HA (Tablet, Browser).
// HA_URL:   leer = gleiche Adresse wie die Seite, sonst z.B. "http://192.168.1.10:8123"
// Achtung: Wer die Datei unter /local/ abrufen kann, sieht den Token (kein Login nötig).
const HA_TOKEN = "";
const HA_URL   = "";
// Feste Umbenennungen: Standard-Entität → deine Entität (optional).
// Beispiel: "sensor.boiler_curflowtemp": "sensor.ems_esp_boiler_curflowtemp"
// ── Samsung EHS Sentinel ──────────────────────────────────────────────
// Bosch-Standard-ID → Samsung-Entität (HACS-Integration „EHS Sentinel“, Präfix samsung_ehssentinel_).
// Ohne Steuermodus legt EHS Sentinel beschreibbare Werte als sensor.* an – das Panel findet sie trotzdem.
const SAM_MODE = true;
const EHS_PREFIX = 'samsung_ehssentinel_';
const E_ = (d,k) => d+'.'+EHS_PREFIX+k;
const SAMSUNG_MAP = {

// Übersetzung für Anzeige reiner Sensoren (Text → deutsch), auch wenn EMS-ESP englisch sendet
function trEnum(enumKey, raw){
  const list = ENUM[enumKey]; if(!list||raw==null) return raw;
  const r = String(raw).toLowerCase();
  const hit = list.find(o=>o[0].toLowerCase()===r || o[1].toLowerCase()===r);

const S = {};                    // entity_id → {state, attributes}
let conn = { type:'none', ready:false, send:null };
const resolved = {};             // Standard-ID → tatsächliche ID (oder null)

// Samsung: Entität über das Namensende „ehssentinel_<name>“ finden – egal welches Präfix
// (samsung_ehssentinel_…, heizung_wp_ehssentinel_… nach Umbenennen) und egal ob number/sensor usw.
function samPick(t){
  const cur=S[t]; if(cur && cur.state!=='unavailable' && cur.state!=='unknown') return t;
  const ck='@'+t; if(ck in resolved){ const r=resolved[ck]; if(r===null || S[r]) return r; }
  const dom=t.split('.')[0], obj=t.split('.')[1]||''; const suf='ehssentinel_'+obj.replace(/^.*?ehssentinel_/,'');
  const order=[dom,'number','select','switch','sensor','binary_sensor'];
  const cands=Object.keys(S).filter(e=>{ const o=e.split('.')[1]||''; return o===suf || o.endsWith('_'+suf); });
  const score=e=>{ const v=S[e].state; return (v==='unavailable'?20:v==='unknown'?10:0) + Math.max(0,order.indexOf(e.split('.')[0])); };
  cands.sort((x,y)=>score(x)-score(y));
  const hit=cands[0]||(cur?t:null); resolved[ck]=hit; return hit;
}
function R(id){                  // Entität auflösen
  if(userMap[id]){ const t=userMap[id]; return t.includes('ehssentinel') ? (samPick(t)||t) : t; }
  if(id.includes('ehssentinel')) return samPick(id)||id;
  if(id in resolved && resolved[id] && S[resolved[id]]) return resolved[id];
  if(S[id]) { resolved[id]=id; return id; }
  // Fallback: gleiche Domain, object_id endet auf die Standard-object_id (z.B. Präfix "ems_esp_")
  const [dom,obj] = id.split('.');
  const cand = Object.keys(S).find(e=>e.startsWith(dom+'.') && e.endsWith('_'+obj));
  resolved[id] = cand||null;
  return cand||id;
}
function has(id){ const r=R(id); return !!S[r] && S[r].state!=='unavailable' && !(r.includes('ehssentinel') && S[r].state==='unknown' && !/^(number|select|switch)\./.test(r)); }
function st(id){ const e=S[R(id)]; return e?e.state:null; }
function at(id,a){ const e=S[R(id)]; return e&&e.attributes?e.attributes[a]:undefined; }
function nv(id){ const v=parseFloat(st(id)); return isNaN(v)?null:v; }
function unit(id){ return at(id,'unit_of_measurement') || SAM_UNIT_OF[(R(id).split('.')[1]||'').replace(EHS_PREFIX,'')] || ''; }
function on(id){ const s=st(id); return s==='on'||s==='true'||s==='1'||s==='ON'||s==='TANK'; }

function selLabel(id, enumKey){
  const s = st(id); if(s==null) return '–';
  if(SAM_MODE && R(id).includes('ehssentinel')) return samTr(s);
  const opts = at(id,'options'); const list = ENUM[enumKey];
  if(list && opts){ const i = opts.indexOf(s); if(i>=0 && list[i]) return list[i][1]; }
  return trEnum(enumKey,s);
}
function selIndex(id){ const opts=at(id,'options')||[]; return opts.indexOf(st(id)); }
function selEnKey(id, enumKey){ const i=selIndex(id); const l=ENUM[enumKey]; if(i>=0&&l&&l[i]) return l[i][0]; return String(st(id)||'').toLowerCase(); }

function callService(domain, service, data){
  if(conn.type==='demo'){ demoApply(domain,service,data); return Promise.resolve(); }
  if(!conn.ready){ toast('Keine Verbindung zu Home Assistant'); return Promise.reject(); }
  return conn.call(domain,service,data).catch(e=>{ toast('Fehler: '+(e&&e.message||e)); throw e; });
}

function setSelectIdx(id,i){ const opts=at(id,'options')||[]; if(opts[i]==null) return; return callService('select','select_option',{entity_id:R(id),option:opts[i]}); }
function setSwitch(id,v){ const d=R(id).split('.')[0]; return callService(d==='input_boolean'?'input_boolean':'switch', v?'turn_on':'turn_off',{entity_id:R(id)}); }

function onStates(list){ list.forEach(e=>S[e.entity_id]={state:e.state,attributes:e.attributes||{}}); for(const k in resolved) delete resolved[k]; scheduleRender(); }
function onChange(e){ if(!e) return; if(e.new_state) S[e.entity_id]={state:e.new_state.state,attributes:e.new_state.attributes||{}}; else delete S[e.entity_id]; if(!resolved[e.entity_id]) for(const k in resolved) if(resolved[k]==null) delete resolved[k]; scheduleRender(); }

async function connect(){
  // a) im HA-Iframe → Verbindung des Frontends mitbenutzen
  if(settings.mode!=='demo' && settings.mode!=='token'){
    try{
      const ha = window.parent && window.parent!==window && window.parent.document.querySelector('home-assistant');
      const hass = ha && ha.hass;
      if(hass && hass.connection){
        const c = hass.connection;
        conn = { type:'hass', ready:true, msg:m=>c.sendMessagePromise(m), call:(d,s,data)=>c.sendMessagePromise({type:'call_service',domain:d,service:s,service_data:data}) };
        onStates(Object.values(hass.states));
        c.subscribeEvents(ev=>onChange(ev.data),'state_changed');
        await loadMgr();
        return;
      }
    }catch(e){ /* anderer Origin */ }
  }
  // b) eigener WebSocket mit Token (Token aus Datei-Kopf hat Vorrang)
  if(MGR && MGR.kiosk_error) toast(MGR.kiosk_error, 6000);
  const token = HA_TOKEN || (MGR && MGR.token) || settings.token;
  if(settings.mode!=='demo' && token){
    let base = HA_URL || settings.url || location.origin;
    if(!/^https?:/.test(base)) base = 'http://homeassistant.local:8123';
    const url = base.replace(/^http/,'ws').replace(/\/$/,'')+'/api/websocket';
    try{ await wsConnect(url, token); await loadMgr(); return; }catch(e){ toast('WebSocket: '+e); }
  }
  // c) Demo
  startDemo();
}
function wsConnect(url, token){
  return new Promise((res,rej)=>{
    let id=1; const pend={}; const ws=new WebSocket(url);
    const send = m => new Promise((ok,ko)=>{ m.id=++id; pend[m.id]={ok,ko}; ws.send(JSON.stringify(m)); });
    ws.onmessage = async ev=>{
      const m=JSON.parse(ev.data);
      if(m.type==='auth_required') ws.send(JSON.stringify({type:'auth',access_token:token}));
      else if(m.type==='auth_invalid'){ rej('Token ungültig'); ws.close(); }
      else if(m.type==='auth_ok'){
        conn = { type:'ws', ready:true, msg:m=>send(m), call:(d,s,data)=>send({type:'call_service',domain:d,service:s,service_data:data}) };
        const r = await send({type:'get_states'}); onStates(r);
        ws.send(JSON.stringify({id:++id,type:'subscribe_events',event_type:'state_changed'}));
        res();
      }
      else if(m.type==='event' && m.event && m.event.data) onChange(m.event.data);
      else if(m.type==='result' && pend[m.id]){ m.success?pend[m.id].ok(m.result):pend[m.id].ko(m.error); delete pend[m.id]; }
    };
    ws.onerror = ()=>rej('Verbindung fehlgeschlagen');
    ws.onclose = ()=>{ if(conn.type==='ws'){ conn.ready=false; toast('Verbindung getrennt – neuer Versuch …'); setTimeout(connect,5000);} };
  });
}


// Verlauf (für Außentemperatur-Grafik): Liste [{t:ms, v:Zahl}]
async function fetchHistory(id, hours){
  const start = new Date(Date.now()-hours*3600e3).toISOString();
  if(conn.type==='demo'){ const out=[]; const now=Date.now(); for(let t=now-hours*3600e3; t<=now; t+=900e3){ const h=new Date(t).getHours()+new Date(t).getMinutes()/60; out.push({t, v: 4+5*Math.max(0,Math.sin((h-7)/24*2*Math.PI))+Math.sin(t/2.7e6)*0.6}); } return out; }
  if(!conn.msg) return [];
  try{
    const r = await conn.msg({type:'history/history_during_period', start_time:start, entity_ids:[R(id)], minimal_response:true, no_attributes:true, significant_changes_only:false});
    const arr = (r && (r[R(id)]||Object.values(r)[0])) || [];
    return arr.map(x=>{ const ts = x.lu!=null ? x.lu*1000 : (x.last_updated_ts!=null ? x.last_updated_ts*1000 : Date.parse(x.last_changed||x.last_updated));
      return {t:ts, v:parseFloat(x.s!=null?x.s:x.state)}; }).filter(p=>!isNaN(p.v)&&!isNaN(p.t));
  }catch(e){ return []; }
}

  USED.forEach((m,id0)=>{
    if(/_hc[234]_/.test(id0)) return;
    const id = (SAM_MODE && userMap[id0]) || id0; const ok = (id.split('.')[1]||'').replace(EHS_PREFIX,''); const sam = id.includes('ehssentinel');
    const dom = id.split('.')[0]; let state='unknown', attributes={};
    if(sam){
      if(dom==='number'){ const d=SAM_DEMO_NUM[ok]||[20,0,90,1]; state=String(d[0]); attributes={min:d[1],max:d[2],step:d[3]}; if(!/^infsv/.test(ok)) attributes.unit_of_measurement='°C'; }
      else if(dom==='select'){ const d=SAM_DEMO_SEL[ok]||[['No','Yes'],'No']; attributes={options:d[0]}; state=d[1]; }
      else if(dom==='switch'||dom==='binary_sensor'){ state = SAM_DEMO_ST[ok]==='on'||DEMO_ON.includes(id0)?'on':'off'; }
      else { const v=SAM_DEMO_ST[ok]; state = v==null?'unknown':String(v);
        if(typeof v==='number') attributes.unit_of_measurement = /press$/.test(ok)?'bar':/overheat/.test(ok)?'K':/temp|tw\d|evain|suction|discharge/.test(ok)?'°C':/hz$/.test(ok)?'Hz':/wattmeterallunit$/.test(ok)?'kW':/heatoutput/.test(ok)?'W':/accum|power(heat|dhw)mode|generatedpower|consumedpower/.test(ok)?'kWh':/minutes/.test(ok)?'min':/flowsensor/.test(ok)?'l/min':/pwm/.test(ok)?'%':/rpm/.test(ok)?'rpm':''; }
      list.push({entity_id:id,state,attributes}); return;
    }
    if(SAM_MODE && id0!=='sensor.thermostat_datetime') return;   // Bosch-Werte ohne Samsung-Gegenstück: in der Demo nicht anzeigen
    if(dom==='number'){ const d=DEMO_NUM[id]||[20,0,90,1,'°C']; state=String(d[0]); attributes={min:d[1],max:d[2],step:d[3],unit_of_measurement:d[4]}; }

    else if(dom==='switch'||dom==='binary_sensor'){ state = DEMO_ON.includes(id)||DEMO[id]==='on'?'on':'off'; }
    else { state = id in DEMO ? String(DEMO[id]) : (m.kind==='bin'?'off':'unknown');
      if(typeof DEMO[id]==='number'){ attributes.unit_of_measurement = /temp|hptc|hptr|hptl|hppl|hpph|hpta|curtemp|settemp|outdoortemp|rettemp|flowtemp/.test(id)?'°C':/spd|pumpmod|level|valve|circspd/.test(id)?'%':/currpower/.test(id)?'W':/hppower/.test(id)?'kW':/syspress/.test(id)?'bar':/flow$/.test(id)?'l/h':/uptime|workm/.test(id)?'min':/nrg|meter/.test(id)?'kWh':''; }
    }
    list.push({entity_id:id,state,attributes});
  });
  onStates(list);
  // leichte Bewegung der Messwerte
  setInterval(()=>{
    const j=(id,a)=>{ if(S[id]){ S[id].state=String((parseFloat(S[id].state)+(Math.random()-.5)*a).toFixed(1)); } };

  const df=g('outdoordefroststep'); if(df && !/^(No defrost operation|unknown|unavailable|0)$/.test(df)) return 'defrost';

  const hz=parseFloat(g('outdoorcomp1runhz')); const comp = g('outdoorcomp1status')==='on' || (!isNaN(hz) && hz>0);

/* ---------- Werte einstellen: Bosch-Rolle (Wert wird beim Verlassen übernommen) ---------- */
function numMeta(id,it){
  let min=+at(id,'min'), max=+at(id,'max'), step=+at(id,'step');
  if(isNaN(min)) min=0; if(isNaN(max)||max<=min) max=min+100; if(!step||isNaN(step)) step=1;
  if(it && it.fmt==='time' && step<15) step=15;
  let u=unit(id); if(u==='C') u='°C';
  return {min,max,step,u};
}
const r3 = x => Math.round(x*1000)/1000;
function rollHtml(t, fmt, unitTxt){
  const p = t.v+t.step<=t.max+1e-9 ? fmt(r3(t.v+t.step)) : '', n = t.v-t.step>=t.min-1e-9 ? fmt(r3(t.v-t.step)) : '';   // oben = höher
  return `<div class="vroll"><div class="col" id="roll"><div class="v p">${p}</div><div class="v c">${fmt(t.v)}</div><div class="v n">${n}</div></div>
      <div class="unit">${esc(unitTxt||'')}</div>
    <div class="ud"><div data-a="${a(()=>stepRoll(t,1))}">${ico(I.up,30)}</div><div data-a="${a(()=>stepRoll(t,-1))}">${ico(I.down,30)}</div></div></div>`;
}
function stepRoll(t,d){ t.v = r3(Math.min(t.max,Math.max(t.min,t.v+d*t.step))); render(); }
function bindRoll(t){
  const col=$('#roll'); if(!col) return; let y0=null, v0=0;
  col.addEventListener('pointerdown',e=>{ y0=e.clientY; v0=t.v; t.dragging=true; col.setPointerCapture(e.pointerId); });
  col.addEventListener('pointermove',e=>{ if(y0==null) return; const s=parseFloat(getComputedStyle($('#dev')).transform.split(',')[3])||1;
    const steps=Math.round((y0-e.clientY)/s/40); const nvv=r3(Math.min(t.max,Math.max(t.min,v0+steps*t.step)));
    if(nvv!==t.v){ t.v=nvv; const c=col.querySelector('.v.c'),p=col.querySelector('.v.p'),n=col.querySelector('.v.n');
      c.textContent=t.fmt(t.v); p.textContent=t.v+t.step<=t.max+1e-9?t.fmt(r3(t.v+t.step)):''; n.textContent=t.v-t.step>=t.min-1e-9?t.fmt(r3(t.v-t.step)):''; } });
  const end=()=>{ if(y0==null) return; y0=null; t.dragging=false; };
  col.addEventListener('pointerup',end); col.addEventListener('pointercancel',end);
  col.addEventListener('wheel',e=>{ e.preventDefault(); stepRoll(t, e.deltaY<0?1:-1); },{passive:false});
}

/* ---------- Heizen (Bosch: Tabs + waagerechte Rolle) ---------- */
let hcTimer=null;
function hRoll(items, idx, onPick){
  // items: [{html,val}] – idx = Mitte
  let pos=PORTRAIT ? [[-1,-132,48,.55],[0,0,100,1],[1,132,48,.55]] : [[-2,-250,46,.25],[-1,-150,64,.7],[0,0,124,1],[1,150,64,.7],[2,250,46,.25]];
  // Abstand nach geschätzter Textbreite (Texte wie „Komfort“ sind breiter als Zahlen) – nie enger als die Standardposition
  const isText = items.some(it=>/[A-Za-zÄÖÜäöü]{3}/.test(String(it.html).replace(/<[^>]*>/g,'')));
  if(isText) pos = PORTRAIT ? [[-1,-132,36,.55],[0,0,80,1],[1,132,36,.55]] : [[-2,-250,34,.25],[-1,-150,50,.7],[0,0,100,1],[1,150,50,.7],[2,250,34,.25]];
  const w = (k,fs) => { const h=String(items[k].html), i=h.indexOf('<sup>'), j=h.indexOf('</sup>'), strip=x=>x.replace(/<[^>]*>/g,'');
    const mn=strip(i<0?h:h.slice(0,i)+h.slice(j+6)), sp=i<0?'':strip(h.slice(i+5,j)); return (mn.length+sp.length*0.45)*fs*0.56; };
  const xs = {}; xs[0]=0;
  pos.slice().sort((p,q)=>Math.abs(p[0])-Math.abs(q[0])).forEach(([o,x,fs])=>{
    if(!o) return; const k=idx+o, prevO=o-Math.sign(o), pk=idx+prevO;
    if(k<0||k>=items.length||pk<0||pk>=items.length){ xs[o]=x; return; }
    const pfs=(pos.find(p=>p[0]===prevO)||[0,0,fs])[2];
    const need=(xs[prevO]||0)+Math.sign(o)*(w(pk,pfs)/2+w(k,fs)/2+28);
    xs[o]= o>0?Math.max(x,need):Math.min(x,need); });
  // Platz prüfen: nichts unter die Pfeile ‹ ›, keine Überlappung der Nachbarn, zu breite Mitte verkleinern
  const half = (PORTRAIT?402:668)/2 - 46, fsz={}, edge={}, skip={};
  pos.slice().sort((p,q)=>Math.abs(p[0])-Math.abs(q[0])).forEach(([o,x0,fs])=>{ const k=idx+o; if(k<0||k>=items.length){ skip[o]=1; return; }
    let ww=w(k,fs);
    if(!o){ if(ww>2*half){ fs=Math.floor(fs*2*half/ww); ww=w(k,fs); } fsz[0]=fs; edge[0]=ww/2; xs[0]=0; return; }
    const sg=Math.sign(o), pO=o-sg; if(skip[pO]||edge[pO]==null){ skip[o]=1; return; }
    let x=Math.abs(xs[o]!=null?xs[o]:x0); if(x+ww/2>half) x=half-ww/2;
    if(x-ww/2 < edge[pO]+18){ skip[o]=1; return; }
    xs[o]=sg*x; edge[o]=x+ww/2; });
  const its = pos.map(([o,x0,fs,op])=>{ const k=idx+o; if(k<0||k>=items.length||skip[o]) return ''; const x=xs[o]!=null?xs[o]:x0; if(!o) fs=fsz[0]||fs;
    return `<div class="it" style="left:calc(50% + ${x}px);transform:translateX(-50%);font-size:${fs}px;opacity:${op}" ${o?`data-a="${a(()=>onPick(k))}"`:''}>${items[k].html}</div>`; }).join('');
  return `<div class="hroll">${its}
    <div class="navl ${idx<=0?'off':''}" data-a="${a(()=>{ if(idx>0) onPick(idx-1); })}">${ico(I.arrL,22)}</div>
    <div class="navr ${idx>=items.length-1?'off':''}" data-a="${a(()=>{ if(idx<items.length-1) onPick(idx+1); })}">${ico(I.arrR,22)}</div></div>`;
}

/* ---------- Zeitprogramm (Schaltzeiten) – über den EMS-ESP Manager ----------
   Telegramm 0x02C3 (HK1): 7 Tage × 6 Schaltpunkte [Modus, Zeit/15 min], 03 = Heizen, 01 = Absenken
   Telegramm 0x02FF (Warmwasser): gleicher Aufbau, Modus = Warmwasser-Stufe 00 Aus, 01 Eco+, 02 Eco, 03 Komfort */
const SCHED = {};                 // hc (1..4) oder 'dhw' → {days:[[{time,mode}]], at, loading, err}
// Stufen je Programm: m = Modus (wie vom Manager), i = Symbol, o = Deckkraft im Tagesbalken (0 = leer)
const SPROG = n => n==='dhw'
  ? {title:'Schaltzeiten Warmwasser', off:'off', first:'comfort',
     modes:[{m:'comfort',l:'Komfort',i:'Komfort',o:1},{m:'eco',l:'Eco',i:'Eco',o:.65},{m:'ecoplus',l:'Eco+',i:'Eco+',o:.35},{m:'off',l:'Aus',i:'Aus',o:0}],
     def:[{time:'05:00',mode:'comfort'},{time:'23:00',mode:'off'}]}
  : {title:'Schaltzeiten', off:'eco', first:'heat',
     modes:[{m:'heat',l:'Heizen',i:'☀',o:1},{m:'eco',l:'Absenken',i:'☾',o:0}],
     def:[{time:'06:00',mode:'heat'},{time:'22:00',mode:'eco'}]};
const smode = (P,m) => P.modes.find(x=>x.m===m) || {m, l:m, i:'?', o:0};
const schedMsg = n => n==='dhw' ? {prog:'dhw'} : {hc:n};
const DAYN = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const DAYS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
function demoSched(n){ const P=SPROG(n); const d=i=>[{time:i<5?'06:00':'08:00',mode:P.first},{time:i===4||i===5?'23:00':'22:00',mode:P.off}]; return [0,1,2,3,4,5,6].map(d); }
async function loadSched(n, force){
  const c = SCHED[n] = SCHED[n] || {};
  if(conn.type==='demo'){ c.days = c.days || demoSched(n); c.complete=true; c.err=null; render(); return; }
  if(!MGR || !conn.msg){ c.err='Nur mit dem EMS-ESP Manager verfügbar'; render(); return; }
  c.loading=true; c.err=null; scheduleRender();
  try{ const r = await conn.msg(Object.assign({type:'ems_esp_manager/schedule/get', force:!!force}, schedMsg(n))); c.days=r.days; c.complete=r.complete; c.updated=r.updated; c.note=r.note; c.at=Date.now(); }
  catch(e){ c.err=(e&&e.message)||String(e); }
  c.loading=false; render();
}
function openSched(n){ push({type:'sched', n}); loadSched(n,false); }
function schedSummary(n){ const c=SCHED[n]; if(!c||!c.days) return ''; const d=c.days[(new Date().getDay()+6)%7]||[]; const P=SPROG(n); return d.map(p=>smode(P,p.mode).i+' '+p.time).join('  '); }
const t2m = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const m2t = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function dayBar(days, i, n){
  const P=SPROG(n);
  const pts = (days[i]||[]).slice().sort((a,b)=>t2m(a.time)-t2m(b.time));
  let prev = null; for(let k=1;k<=7 && !prev;k++){ const p=days[(i-k+7)%7]||[]; if(p.length) prev=p.slice().sort((a,b)=>t2m(a.time)-t2m(b.time)).pop().mode; }
  let cur = prev||P.off, from = 0, segs=[];
  const op = m => smode(P,m).o;
  pts.forEach(p=>{ const m=t2m(p.time); if(op(cur) && m>from) segs.push([from,m,op(cur)]); cur=p.mode; from=m; });
  if(op(cur)) segs.push([from,1440,op(cur)]);
  return `<span class="sbar">${segs.map(([a,b,o])=>`<i style="left:${a/14.4}%;width:${(b-a)/14.4}%;opacity:${o}"></i>`).join('')}${[0,6,12,18].map(h=>`<b style="left:${h/24*100}%">${h}</b>`).join('')}</span>`;
}

     ${c.note?`<div class="note" style="color:#d98a00">${esc(c.note)}</div>`:''}

function vSchedEdit(t){
  const pts=t.pts; const P=SPROG(t.n);
  const step=(i,d)=>{ let m=(t2m(pts[i].time)+d+1440)%1440; pts[i].time=m2t(m); render(); };

  const add = pts.length<6 ? `<div class="row" data-a="${a(()=>{ const last=pts.length?t2m(pts[pts.length-1].time):360; pts.push({time:m2t(Math.min(1425,last+60)),mode:pts.length&&pts[pts.length-1].mode!==P.off?P.off:P.first}); render(); })}"><span class="k">+ Schaltpunkt hinzufügen</span><span class="v">${pts.length}/6</span></div>` : '';
  const copyRow = `<div class="row" data-a="${a(()=>{ t.copy = t.copy==='week'?'all':t.copy==='all'?'':'week'; render(); })}"><span class="k">Beim Speichern übernehmen für<small>Tippen zum Wechseln</small></span><span class="v">${t.copy==='week'?'Mo–Fr':t.copy==='all'?'Alle Tage':DAYN[t.day]+' (nur dieser Tag)'}</span></div>`;
  const save = async()=>{
    const sorted = pts.slice().sort((x,y)=>t2m(x.time)-t2m(y.time));
    if(!sorted.length){ toast('Mindestens ein Schaltpunkt'); return; }
    if(new Set(sorted.map(p=>p.time)).size!==sorted.length){ toast('Zwei Schaltpunkte mit gleicher Zeit'); return; }
    const targets = t.copy==='week'?[0,1,2,3,4]:t.copy==='all'?[0,1,2,3,4,5,6]:[t.day];

      c.days=r.days; c.complete=r.complete; c.updated=r.updated; c.note=r.note; c.at=Date.now();

    <div class="btns"><div class="btn" data-a="${a(pop)}">Abbrechen</div><div class="btn pri" data-a="${a(save)}">Speichern</div></div>`;

/* „Heute“ = Zählerstand jetzt − Zählerstand um 0:00 (aus dem HA-Verlauf) */
const ETODAY = {at:0, day:'', v:{}, loading:false, err:null};
async function loadEnergyToday(force){
  const keys=['nrgconscomptotal','auxelecheatnrgconstotal','nrgsupptotal'];
  const day=new Date().toDateString();
  if(ETODAY.loading || (!force && ETODAY.day===day && Date.now()-ETODAY.at<300e3)) return;
  ETODAY.loading=true;
  const mid=new Date(); mid.setHours(0,0,0,0);
  const hours=(Date.now()-mid.getTime())/3600e3;
  const v={}; let miss=0;
  for(const k of keys){
    const id=B(k); if(!has(id)){ v[k]=0; continue; }
    if(conn.type==='demo'){ v[k]={nrgconscomptotal:6,auxelecheatnrgconstotal:0,nrgsupptotal:25}[k]*Math.max(.1,hours/24); continue; }
    const h=await fetchHistory(id, hours);
    const first=h[0], cur=nv(id);
    if(first==null||cur==null){ v[k]=null; miss++; continue; }
    v[k]=Math.max(0,cur-first.v);
  }
  Object.assign(ETODAY,{v, day, at:Date.now(), loading:false, err: miss?'Kein Verlauf seit 0:00 – Entität wird im Recorder nicht aufgezeichnet?':null});
  scheduleRender();
}

  const comp=g(c[1]), aux=g(c[2]), sup=g(c[3]); const env=Math.max(0,sup-comp-aux); const tot=comp+aux+env||1;
  const pc=x=>Math.round(x/tot*100); const R_=62, C=2*Math.PI*R_; let off=0;

  const floor = selEnKey('select.'+hcX(n,'heatingtype'),'hc.heatingtype')==='floor'; const ex = floor?1/1.1:1/1.3;
  const f = to=>{ if(to>=room) return Math.max(minF,room); const r=Math.pow((room-to)/(room-minExt),ex); return Math.min(maxF,Math.max(minF, room+(design-room)*r + off + (room-20)*1.5)); };
  const W=PORTRAIT?378:660,H=PORTRAIT?250:240,x0=PORTRAIT?36:50,y0=20; const X=to=>x0+(20-to)/45*(W-x0-10); const Y=tf=>y0+(1-(tf-15)/(Math.max(60,maxF+5)-15))*(H-y0-30);

  for(let tf=20;tf<=Math.max(60,maxF+5);tf+=10) grid.push(`<line x1="${x0}" x2="${W-10}" y1="${Y(tf)}" y2="${Y(tf)}" stroke="#e6eaf0"/><text x="${x0-8}" y="${Y(tf)+4}" fill="#8a929c" font-size="12" text-anchor="end">${tf}°</text>`);

  const it = [N('number.'+hcX(n,'designtemp'),'Auslegungstemperatur'),N('number.thermostat_minexttemp','Min. Außentemperatur'),N('number.'+hcX(n,'offsettemp'),'Raumtemperatur-Offset'),

      ${grid.join('')}<line x1="${x0}" x2="${x0}" y1="${y0}" y2="${H-30}" stroke="#c9cfd7"/>
      <line x1="${x0}" x2="${W-10}" y1="${Y(maxF)}" y2="${Y(maxF)}" stroke="#e0453a" stroke-dasharray="4 4"/><line x1="${x0}" x2="${W-10}" y1="${Y(minF)}" y2="${Y(minF)}" stroke="#3a95e6" stroke-dasharray="4 4"/>

    <div class="list">${it.map(rowHtml).join('')}</div></div>`;

/* ---------- EHS Sentinel: Verbindung & Protokoll (über Integration „Samsung EHS Panel“) ---------- */
const EHSP='samsung_ehs_panel/';
function ehsDemo(m){
  const now=Date.now()/1000, L=(i,l,n,msg)=>({id:i,ts:now-(40-i)*37,level:l,name:'ehs_sentinel.'+n,msg});
  if(m.type===EHSP+'status') return {version:'demo',log_level:'default',instances:[{entry_id:'demo',title:'WP EHSSentinel',state:'loaded',loaded:true,connected:true,running:true,
    ip:'192.168.1.50',port:4196,write_mode:true,polling:false,extended_logging:false,stats:{packets_read:18234,packets_processed:18190,packets_processed_not_indoor_outdoor:44,packets_requested:312},queue:0}]};
  if(m.type===EHSP+'logs') return {entries:[L(1,'INFO','coordinator','Starting EHS Sentinel Coordinator..'),L(2,'INFO','coordinator','Attempting to connect to TCP device...'),
    L(3,'INFO','coordinator','Pre-initialized entities: sensor=412 number=96 select=48 switch=12'),L(4,'WARNING','coordinator','TCP connection lost while requesting writable entities: [Errno 104] Connection reset by peer'),
    L(5,'INFO','coordinator','Attempting to connect to TCP device...'),L(6,'INFO','coordinator','Confirming write for NASA_INDOOR_DHW_SET_TEMP with value: 50, target value was: 50'),
    L(7,'INFO','coordinator','[EHS-Sentinel Diagnostics] MessageCounters: read=18234 processed=18190 not_from_indoor/outdoor=44 requested=312')].filter(e=>m.level==='all'||['WARNING','ERROR'].includes(e.level)||m.level==='info')};
  if(m.type===EHSP+'packet_log') return {files:[],file:null,lines:[]};
  return {ok:true,level:m.level||'default'};
}
function ehsMsg(m){
  if(conn.type==='demo') return Promise.resolve(ehsDemo(m));
  if(!conn.ready||!conn.msg) return Promise.reject({message:'Keine Verbindung zu Home Assistant'});
  return conn.msg(m);
}
function ehsErr(e){
  const c=e&&e.code, m=(e&&e.message)||String(e||'Fehler');
  if(c==='unknown_command'||/unknown command/i.test(m)) return 'Diese Funktion braucht die Integration „Samsung EHS Panel“ (ab Version 1.1) – das Panel ist gerade als einzelne Datei geöffnet.';
  if(c==='unauthorized') return 'Nur für Administratoren.';
  return m;
}
function ehsLoad(t){
  if(t.loading) return; t.loading=true;
  const req = t.type==='ehsconn' ? {type:EHSP+'status'} : t.type==='ehslog' ? {type:EHSP+'logs',level:t.level||'all',limit:500} : {type:EHSP+'packet_log',lines:300,...(t.file?{file:t.file}:{})};
  ehsMsg(req).then(r=>{ t.data=r; t.err=null; }).catch(e=>{ t.err=ehsErr(e); }).finally(()=>{ t.loading=false; t.at=Date.now(); if(top_()===t) render(); });
}

function ehsCopy(text){

  fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Kopieren nicht möglich'); } ta.remove(); }
}

function vEhsPkt(t){

    : !files.length ? '<div class="note">Kein Paket-Log vorhanden. In EHS Sentinel unter „Konfigurieren“ das erweiterte Logging aktivieren – die Datei liegt dann unter www/ehs_sentinel/logs/.</div>'
    : lines.map(l=>`<div class="pkt">${esc(l)}</div>`).join('') || '<div class="note">Datei ist leer.</div>';
  const sel = files.length>1 ? `<div class="lfil">${files.map(f=>`<span class="${f===d.file?'on':''}" data-a="${a(()=>{ t.file=f; t.data=null; render(); })}">${esc(f.replace(/^packet_|\.log$/g,''))}</span>`).join('')}<span class="sp"></span>
      <span data-a="${a(()=>ehsCopy((d.lines||[]).join('\n')))}">Kopieren</span></div>`
    : files.length ? `<div class="lfil"><span class="sp">${esc(d.file||'')}</span><span data-a="${a(()=>ehsCopy((d.lines||[]).join('\n')))}">Kopieren</span></div>` : '';
  return header('Paket-Log')+`<div class="body">${sel}${rows}</div>`;
}
function vContact(){
  return header('Kontaktdaten Installateur')+`<div class="body"><div class="list">
   <div class="row ro"><span class="k">Name</span><span class="v d">${esc(INSTALLER.name)}</span></div>
   <div class="row ro"><span class="k">Adresse</span><span class="v d">${esc(INSTALLER.addr)}</span></div>
   ${INSTALLER.tel?`<div class="row ro"><span class="k">Telefon</span><span class="v d">${esc(INSTALLER.tel)}</span></div>`:''}</div></div>`;
}
function vPanel(){
  const total=[...USED.keys()].filter(id=>!/_hc[234]_/.test(id)||hcExists(+id.match(/_hc(\d)_/)[1]));
  const found=total.filter(has).length;
  return header('Panel-Einstellungen')+`<div class="body"><div class="list">
    <div class="row" data-a="${a(()=>push({type:'map',filter:'all'}))}"><span class="k">Entitäten-Zuordnung<small>${found} von ${total.length} gefunden</small></span><span class="v">${I.chevR}</span></div>
    <div class="row" data-a="${a(()=>push({type:'map',filter:'miss'}))}"><span class="k">Nur fehlende Entitäten</span><span class="v">${total.length-found}${I.chevR}</span></div>
    <div class="row" data-a="${a(()=>{settings.showMissing=!settings.showMissing;saveSettings();render();})}"><span class="k">Fehlende Entitäten in Menüs anzeigen</span><span class="v"><span class="tog ${settings.showMissing?'on':''}"></span></span></div>
    <div class="row" data-a="${a(()=>push({type:'io'}))}"><span class="k">Zuordnung exportieren / importieren</span><span class="v">${I.chevR}</span></div>
    <div class="row" data-a="${a(()=>{ userMap=Object.assign({},ENTITY_OVERRIDES); saveMap({}); toast('Eigene Zuordnungen gelöscht'); render(); })}"><span class="k">Eigene Zuordnungen zurücksetzen</span><span class="v"></span></div>
  </div></div>`;
}
/* ---------- Entitäten-Zuordnung, gruppiert ---------- */
const MAP_GROUPS = [
  ['heat',  'Heizung'],
  ['dhw',   'Warmwasser'],
  ['hp',    'Wärmepumpe'],
  ['aux',   'Zuheizer'],
  ['pv',    'Photovoltaik'],
  ['energy','Energie & Statistik'],
  ['sys',   'Systemwerte'],
  ['other', 'Sonstiges'],
];
const SYS_IDS = /^(boiler_(reset|outdoortemp|curflowtemp|rettemp|syspress|lastcode|servicecode|servicecodenumber|maintenancemessage)|thermostat_(errorcode|lastcode|datetime|dampedoutdoortemp|absent|building|damping|intoffset|minexttemp|solar|floordry|floordrytemp))$/;
function mapGroup(id){
  const o = id.split('.')[1]||'';
  let m;
  if(/nrg|meter|uptime|starts|hpcurrpower|^boiler_hppower$|maxheat|hpmaxpower|powerlimit|powerreduction/.test(o)) return {g:'energy'};
  if(/(^|_)pv/.test(o)) return {g:'pv'};
  if(/^(boiler|thermostat)_dhw_/.test(o)) return {g:'dhw'};
  if((m=o.match(/^thermostat_hc(\d)_/))) return {g:'heat', hc:+m[1]};
  if(/aux|elheat|emergency|heatcable/.test(o)) return {g:'aux'};
  if(SYS_IDS.test(o)) return {g:'sys'};
  if(/^boiler_/.test(o)) return {g:'hp'};
  return {g:'other'};
}
function mapIds(){ return [...USED.keys()].filter(id=>!/_hc[234]_/.test(id)||hcExists(+id.match(/_hc(\d)_/)[1])); }
// Bezeichnungen für Werte ohne eigenen Menüeintrag bzw. mit mehrdeutigem Menütext
const MAP_LABELS = {
  thermostat_dhw_chargeduration:'Extra-Warmwasser Dauer', thermostat_dhw_charge:'Extra-Warmwasser starten', thermostat_dhw_extra:'Extra-Warmwasser aktiv',
  thermostat_dhw_modetype:'Aktuelles Warmwasser-Niveau', thermostat_dhw_mode:'Betriebsart Warmwasser', boiler_dhw_curtemp:'Warmwassertemperatur',
  thermostat_minexttemp:'Min. Außentemperatur (Auslegung)', boiler_outdoortemp:'Außentemperatur', boiler_curflowtemp:'Vorlauftemperatur',
  boiler_rettemp:'Rücklauftemperatur', boiler_syspress:'Betriebsdruck', thermostat_absent:'Abwesend',
  boiler_hpactivity:'Betriebsart Wärmepumpe', boiler_silentmode:'Geräuscharmer Betrieb', boiler_silentfrom:'Geräuscharm von', boiler_silentto:'Geräuscharm bis',
  thermostat_dhw_circmode:'Zirkulation Betriebsart', boiler_fanspd:'Ventilator Drehzahl', boiler_fan:'Ventilator (Funktionstest)',
  thermostat_dhw_disinfecttime:'Desinfektion Zeit', thermostat_dhw_dailyheattime:'Tägliche Aufheizung Zeit',
  boiler_auxheaterstatus:'Zuheizer Status', boiler_auxheaterlevel:'Zuheizer Leistung', thermostat_floordry:'Estrichtrocknung Status', thermostat_floordrytemp:'Estrichtrocknung Solltemperatur',
  boiler_pumpkickday:'Blockierschutz Tag', boiler_pumpkickhour:'Blockierschutz Uhrzeit', boiler_pumpkickdelay:'Blockierschutz Intervall', boiler_dhw_workm:'Laufzeit Warmwasser',
};
const HC_LABELS = { mode:'Betriebsart', designtemp:'Auslegungstemperatur', offsettemp:'Raumtemperatur-Offset', minflowtemp:'Min. Vorlauftemperatur',
  maxflowtemp:'Max. Vorlauftemperatur', seltemp:'Wunschtemperatur', currtemp:'Raumtemperatur', targetflowtemp:'Berechnete Vorlauftemperatur', remotehum:'Luftfeuchte',
  hpoperatingmode:'Betriebsart Heizkreis', comforttemp:'Heizen (Zeitprogramm)' };
function mapLabel(id){
  const o = id.split('.')[1]||'', u = USED.get(id)||{}, lb = u.label||'';
  if(MAP_LABELS[o]) return MAP_LABELS[o];
  const hc = o.match(/^thermostat_hc\d_(.+)$/); if(hc && HC_LABELS[hc[1]]) return HC_LABELS[hc[1]];
  if(/uptime/.test(o)) return /laufzeit/i.test(lb)?lb:'Laufzeit '+(lb||o);
  if(/starts/.test(o)) return /start/i.test(lb)?lb:'Starts '+(lb||o);
  if(/auxelecheatnrgcons/.test(o)) return 'Stromverbrauch '+(lb||o);
  if(/nrgcons/.test(o)) return 'Stromverbrauch '+(lb||o);
  if(/nrgsupp/.test(o)) return 'Erzeugte Wärme '+(lb||o);
  return lb || o.replace(/^(boiler|thermostat)_/,'');
}
// Gruppen-Schlüssel: Heizkreise einzeln (heat1, heat2 …)
function mapBuckets(){
  const multi = HEATING_CIRCUITS.filter(hcExists).length>1;
  const b = new Map();
  MAP_GROUPS.forEach(([k,name])=>{ if(k==='heat') HEATING_CIRCUITS.filter(hcExists).forEach(n=>b.set('heat'+n,{name: multi?`Heizung – ${hcName(n)}`:'Heizung', ids:[]})); else b.set(k,{name,ids:[]}); });
  mapIds().forEach(id=>{ const r=mapGroup(id); const k = r.g==='heat' ? 'heat'+r.hc : r.g; (b.get(k)||b.get('other')).ids.push(id); });
  for(const [k,v] of b) if(!v.ids.length) b.delete(k);
  return b;
}
function vMap(t){
  const miss = t.filter==='miss';
  const all = mapIds(), found = all.filter(has).length, custom = Object.keys(diffMap()).length;
  const rows = [...mapBuckets()].map(([k,v])=>{
    const f=v.ids.filter(has).length, n=v.ids.length, nm=n-f;
    if(miss && !nm) return '';
    return `<div class="row" data-a="${a(()=>push({type:'mapgrp',g:k,filter:t.filter}))}"><span class="k">${esc(v.name)}<small>${f} von ${n} gefunden</small></span><span class="v">${nm?`<span class="pill no">${nm} fehlt</span>`:'<span class="pill">OK</span>'}${I.chevR}</span></div>`;
  }).join('');
  return header(miss?'Fehlende Entitäten':'Entitäten-Zuordnung')+`<div class="body"><div class="list">
    <div class="row ro"><span class="k">Gefunden<small>${custom} eigene Zuordnung${custom===1?'':'en'}</small></span><span class="v d">${found} von ${all.length}</span></div>
    <div class="row" data-a="${a(()=>{ t.filter=miss?'all':'miss'; render(); })}"><span class="k">Nur fehlende anzeigen</span><span class="v"><span class="tog ${miss?'on':''}"></span></span></div>
    ${rows||'<div class="note">Alle Entitäten gefunden.</div>'}</div></div>`;
}
function vMapGroup(t){
  const v = mapBuckets().get(t.g) || {name:'Zuordnung', ids:[]};
  let ids = v.ids.slice().sort((x,y)=>mapLabel(x).localeCompare(mapLabel(y),'de'));
  if(t.filter==='miss') ids = ids.filter(id=>!has(id));
  const rows = ids.map(id=>{ const r=R(id), ok=has(id), custom=!!userMap[id];
    return `<div class="row" data-a="${a(()=>push({type:'mapedit',id}))}"><span class="k" style="font-size:18px">${esc(mapLabel(id))}<small>${esc(r!==id?r:id)}${r!==id?(custom?' · manuell':' · automatisch'):''}</small></span><span class="v"><span class="pill ${ok?'':'no'}">${ok?'OK':'fehlt'}</span>${I.chevR}</span></div>`; }).join('');
  return header(v.name)+`<div class="body"><div class="list">${rows||'<div class="note">Keine fehlenden Entitäten in dieser Gruppe.</div>'}</div></div>`;
}
function vMapEdit(t){
  const dom=t.id.split('.')[0]; const cands=Object.keys(S).filter(e=>e.startsWith(dom+'.')).sort();
  const obj=t.id.split('.')[1].replace(/^(boiler|thermostat)_/,''); const sugg=cands.filter(e=>e.includes(obj.split('_').pop())).slice(0,8);
  return header('Zuordnung')+`<div class="body kbd"><div style="padding:14px 20px">
    <div style="font-size:15px;color:#6b7380">Funktion</div><div style="font-size:19px;margin:4px 0 10px">${esc(mapLabel(t.id))} <span style="color:#8a929c;font-size:15px">· ${esc((MAP_GROUPS.find(g=>g[0]===mapGroup(t.id).g)||[,''])[1])}</span></div>
    <div style="font-size:15px;color:#6b7380">Standard-ID (Menü)</div><div style="font-size:19px;margin:4px 0 14px">${esc(t.id)}</div>
    <div style="font-size:15px;color:#6b7380;margin-bottom:6px">Deine Entität</div>
    <input id="mapin" list="dl" value="${esc(userMap[t.id]||R(t.id))}"><datalist id="dl">${cands.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    ${sugg.length?`<div style="font-size:15px;color:#6b7380;margin:14px 0 6px">Vorschläge</div>${sugg.map(s=>`<div class="row" style="min-height:44px;font-size:16px" data-a="${a(()=>{$('#mapin').value=s;})}">${esc(s)} <span class="v d">${esc((S[s]||{}).state)}</span></div>`).join('')}`:''}
  </div></div>
  <div class="btns"><div class="btn" data-a="${a(()=>{ delete userMap[t.id]; saveMap(diffMap()); pop(); })}">Standard</div><div class="btn" data-a="${a(pop)}">Abbrechen</div>
    <div class="btn pri" data-a="${a(()=>{ const v=$('#mapin').value.trim(); if(v && v!==t.id) userMap[t.id]=v; else delete userMap[t.id]; saveMap(diffMap()); toast(has(t.id)?'Zuordnung OK':'Entität nicht gefunden'); pop(); })}">Speichern</div></div>`;
}
function diffMap(){ const o={}; for(const k in userMap) if(ENTITY_OVERRIDES[k]!==userMap[k]) o[k]=userMap[k]; return o; }
function vIO(t){
  return header('Export / Import')+`<div class="body kbd"><div style="padding:12px 20px">
   <div class="note" style="padding:0 0 8px">${MGR?'Eigene Zuordnungen als JSON. Sie werden im EMS-ESP Manager in Home Assistant gespeichert und bleiben bei neuen Panel-Versionen erhalten.':'Eigene Zuordnungen als JSON. Zum dauerhaften Einbau in ENTITY_OVERRIDES oben in der Datei einfügen.'}</div>
   <textarea id="io" rows="9">${esc(JSON.stringify(diffMap(),null,1))}</textarea></div></div>
   <div class="btns"><div class="btn" data-a="${a(()=>{ const ta=$('#io'); ta.select(); try{navigator.clipboard.writeText(ta.value);}catch(e){} toast('Kopiert'); })}">Kopieren</div>
   <div class="btn pri" data-a="${a(()=>{ try{ const o=JSON.parse($('#io').value); userMap=Object.assign({},ENTITY_OVERRIDES,o); saveMap(o); toast('Importiert'); pop(); }catch(e){ toast('Ungültiges JSON'); } })}">Importieren</div></div>`;
}
function vPin(t){
  const keys=['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
  const press=k=>{ if(k==='⌫') t.code=t.code.slice(0,-1); else if(k==='OK'){ if(t.code===SERVICE_PIN){ svcOk=Date.now(); stack.pop(); push({type:'menu',id:t.next}); return; } toast('Falscher Code'); t.code=''; } else if(t.code.length<6) t.code+=k; render(); };
  return header('Service – Code')+`<div style="text-align:center;font-size:40px;letter-spacing:12px;margin:96px 0 14px">${'•'.repeat(t.code.length)||'&nbsp;'}</div>
   <div style="display:grid;grid-template-columns:repeat(3,110px);gap:10px;justify-content:center">${keys.map(k=>`<div class="btn" style="height:66px" data-a="${a(()=>press(k))}">${k}</div>`).join('')}</div>`;
}


/* ---------- Hilfe, Reinigung, Bildschirmschoner ---------- */
const HELP = {
  home:'Kacheln antippen zum Öffnen, mit den Pfeilen oder Wischen blättern. ≡ öffnet das Menü, ≡ 2 Sekunden gedrückt halten öffnet das Servicemenü. Der Haken zeigt Störungen.',
  hc:'Aus / Auto / Manuell wählt die Betriebsart. Wunschtemperatur mit den Pfeilen oder durch Antippen der Nachbarwerte ändern – sie wird nach ca. 1 s an EMS-ESP gesendet.',
  dhwp:'Eco+: beste Wirtschaftlichkeit · Eco: mittlerer Komfort · Komfort: bester Warmwasserkomfort.',
  energy:'Umweltanteil = erzeugte Wärme − Strom Kompressor − Strom Zuheizer (Werte aus EMS-ESP).',
  curve:'Die Kurve ist eine Näherung aus Auslegungstemperatur, min. Außentemperatur und Offset. Der blaue Punkt ist der aktuelle Vorlauf-Sollwert der WP.',
  edit:'Wert mit ˄ / ˅, Mausrad oder Wischen auf der Zahl einstellen. Beim Zurückgehen wird der Wert an die Wärmepumpe gesendet.',
  ov:'Links Außentemperatur (antippen = Verlauf gestern/heute) und Betriebsdruck. Rechts Vor-/Rücklauf der Außeneinheit, Heizkreis und Warmwasser.',
  outdoor:'Verlauf der Außentemperatur aus der Home-Assistant-Historie.',
};
function showHelp(){
  const t=top_(); const txt = HELP[t.type] || (t.type==='menu'?`„${(typeof (MENUS[t.id]||{}).title==='function'?MENUS[t.id].title():(MENUS[t.id]||{}).title)}“: Pfeil = Untermenü/Einstellung, Schalter wirken sofort.`:'');
  const o=$('#ovl'); o.style.display='block';
  o.innerHTML=`<div style="position:absolute;inset:0;background:rgba(0,0,0,.7)" data-close="1"></div><div class="pop"><div class="x" data-close="1">×</div>
    <h3>${ico(I.help,26)} Hilfe</h3><div>${esc(txt)}</div>
    <div style="margin-top:18px;font-size:15px;color:#6b7380">Verbindung: ${conn.type}${conn.type==='demo'?' (Demo-Daten)':''} · ${SAM_MODE?'Datenquelle EHS Sentinel · Samsung EHS mit HMI-800-Menü':'Datenquelle EMS-ESP · Bosch-HMI-800-Nachbau für Home Assistant'}</div></div>`;
  o.onclick=e=>{ if(e.target.dataset.close){ o.style.display='none'; o.innerHTML=''; } };
}
function cleanMode(){
  const o=$('#ovl'); o.style.display='block'; let n=15;
  const upd=()=>{ o.innerHTML=`<div class="saver" style="z-index:41">${ico(I.hand,80)}<div style="font-size:26px;color:#9aa1ab">Display-Reinigung</div><div class="clk">${n}</div></div>`; };
  upd(); const iv=setInterval(()=>{ n--; if(n<=0){ clearInterval(iv); o.style.display='none'; o.innerHTML=''; } else upd(); },1000);
  o.onclick=null;
}
let idleT=null, saverOn=false;
function resetIdle(){ if(saverOn){ saverOn=false; $('#ovl').style.display='none'; $('#ovl').innerHTML=''; } clearTimeout(idleT); if(settings.saver>0) idleT=setTimeout(showSaver, settings.saver*60000); }
function showSaver(){
  saverOn=true; const o=$('#ovl'); o.style.display='block';
  const upd=()=>{ if(!saverOn) return; o.innerHTML=`<div class="saver"><div class="clk">${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div><div style="font-size:24px;display:flex;align-items:center;gap:6px">${I.houseT} ${tempTxt('sensor.boiler_outdoortemp',1)}</div></div>`; setTimeout(upd,20000); };
  upd(); home();
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,resetIdle,true));
function applyDisplay(){ $('#dim').style.opacity = String((100-settings.brightness)/100*0.8); resetIdle(); }

/* ---------- Skalierung ---------- */
let PORTRAIT=false;
function fit(){
  const w=innerWidth, h=innerHeight, dev=$('#dev');
  const p = h > w*1.15;                       // Hochformat → Handy-Layout (iPhone 17: 402 pt breit)
  const changed = p!==PORTRAIT; PORTRAIT=p; document.body.classList.toggle('portrait',p);
  if(p){ const W=402, s=w/W; dev.style.width=W+'px'; dev.style.height=(h/s)+'px'; dev.style.transform=`scale(${s})`; }
  else { const s=Math.min(w/800,h/480); dev.style.width='800px'; dev.style.height='480px'; dev.style.transform=`scale(${s})`; }
  if(changed && typeof render==='function' && stack) render();
}
addEventListener('resize',fit);

/* ---------- Start ---------- */
fit(); applyDisplay(); render(); connect().then(render);
</script>
</body>
</html>
