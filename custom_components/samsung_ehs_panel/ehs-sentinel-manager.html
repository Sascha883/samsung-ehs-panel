<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>EHS Panel – Verwaltung</title>
<style>
/* Farben werden beim Start aus dem Home-Assistant-Theme übernommen (Fallback: dunkel) */
:root{
  --bg:#111418; --card:#1c1f24; --card2:#24282e; --txt:#e3e5e8; --dim:#9aa0a6; --line:#33383f;
  --acc:#03a9f4; --ok:#43a047; --warn:#ffa600; --err:#db4437; --r:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#fafafa; --card:#fff; --card2:#f2f4f7; --txt:#212121; --dim:#6b7280; --line:#e0e0e0; color-scheme:light; }
}
:root[data-theme="light"]{ --bg:#fafafa; --card:#fff; --card2:#f2f4f7; --txt:#212121; --dim:#6b7280; --line:#e0e0e0; color-scheme:light; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Roboto,"Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{padding:20px 24px 40px;max-width:1700px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
@media (max-width:1150px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px 12px 30px}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:16px;font-weight:500;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
h2 svg{width:18px;height:18px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:14px 16px}
.hero b{display:block;font-size:16px;margin-bottom:4px}
.hero a{color:var(--acc)}
.act{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--txt);font:inherit;text-align:left;width:100%}
.act:hover{background:var(--card2)}
.act:disabled{opacity:.5;cursor:default}
.act .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);flex:none}
.act .ic.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.act .ic svg{width:20px;height:20px}
.act small{display:block;color:var(--dim);font-size:13px}
.rows .r{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 16px;border-top:1px solid var(--line)}
.rows .r:first-child{border-top:0}
.rows .r .k{display:flex;align-items:center;gap:12px;color:var(--txt);min-width:0}
.rows .r .k svg{width:20px;height:20px;color:var(--dim);flex:none}
.rows .r .v{color:var(--txt);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:12px;font-weight:500}
.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.no{background:color-mix(in srgb,var(--err) 20%,transparent);color:var(--err)}
.pill.dm{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
form .f{padding:10px 16px;border-top:1px solid var(--line)}
form .f:first-child{border-top:0}
form label.t{display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.4}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.sw small{display:block;color:var(--dim);font-size:12.5px}
.sw input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{left:21px}
details summary{cursor:pointer;color:var(--dim);font-size:13.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:14px;border-radius:18px;padding:7px 16px;cursor:pointer;border:1px solid var(--acc);background:transparent;color:var(--acc)}
.btn.pri{background:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin:0 16px 12px;padding:8px 12px;border-radius:8px;font-size:13.5px}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.msg.err{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.msg.info{background:var(--card2);color:var(--dim)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-size:14.5px;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:10px 16px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button svg{width:18px;height:18px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.tabs .cnt{font-size:12px;background:var(--card2);border-radius:10px;padding:0 7px;color:var(--dim)}
.log{margin-top:0}
.log .lbody{max-height:calc(100vh - 190px);min-height:300px}
.etool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.etool input[type=search]{flex:1 1 260px;min-width:200px;font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.etbl{width:100%;border-collapse:collapse;font-size:14px}
.etbl th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:500;color:var(--dim);font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line);z-index:1}
.etbl td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.etbl td.n{min-width:0;word-break:break-word}
.etbl td.n small{display:block;color:var(--dim);font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.etbl td.v{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.etbl td.c{width:230px}
.etbl td.c input[type=number],.etbl td.c select{padding:5px 8px;font-size:13.5px;width:100%}
.etbl td.d{color:var(--dim);font-size:12.5px;white-space:nowrap}
.etbl tr.unav td.v{color:var(--dim)}
.etbl tr.flash td{background:color-mix(in srgb,var(--acc) 12%,transparent);transition:background .6s}
.ewrap{max-height:calc(100vh - 230px);overflow:auto}
.mapw{max-width:980px;margin:0 auto}
.mtop{display:flex;gap:12px;align-items:center;margin:0 0 16px}
.mtop input{flex:1;max-width:420px;font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.mtop span{color:var(--dim);font-size:13.5px}
.mas{columns:3 380px;column-gap:20px}
.mas .card{break-inside:avoid;margin:0 0 20px;display:block}
.mas h3{font-size:22px;font-weight:400;margin:0;padding:18px 18px 10px}
.mr{display:flex;align-items:center;gap:16px;padding:8px 18px;min-height:48px}
.mr .ico{width:22px;height:22px;color:color-mix(in srgb,var(--acc) 70%,var(--dim));flex:none}
.mr .ico.on{color:#fdd835}
.mr .nm{flex:1;min-width:0;font-size:14.5px}
.mr .nm small{display:block;color:var(--dim);font-size:11.5px;word-break:break-all}
.mr .vl{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.mr.unav .vl,.mr.unav .nm{color:var(--dim)}
.nbox{display:flex;align-items:center;background:var(--card2);border-bottom:1px solid var(--dim);border-radius:4px 4px 0 0;min-width:96px}
.nbox input{width:72px;background:transparent;border:0;color:var(--txt);font:inherit;text-align:right;padding:12px 4px 12px 10px}
.nbox span{color:var(--txt);padding-right:12px;font-size:14px}
.sbox{flex:1;min-width:0;background:var(--card2);border-bottom:1px solid var(--dim);border-radius:4px 4px 0 0;padding:6px 12px 4px}
.sbox label{display:block;font-size:11.5px;color:var(--dim)}
.sbox select{width:100%;background:transparent;border:0;color:var(--txt);font:inherit;padding:2px 0 4px;appearance:auto}
.sbox select option{background:var(--card);color:var(--txt)}
.mapw h1{font-size:24px;font-weight:400;text-align:center;margin:4px 0 14px}
.mapw .bar{height:3px;border-radius:2px;background:var(--acc);margin-bottom:18px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.sum button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;cursor:pointer;color:var(--dim);text-align:center}
.sum button b{display:block;font-size:34px;font-weight:400;line-height:1.15;color:var(--txt)}
.sum button.g b{color:var(--ok)}.sum button.m b{color:var(--err)}.sum button.x b{color:var(--dim)}
.sum button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--txt)}
.vcard{display:flex;align-items:center;gap:16px;padding:16px 20px}
.vcard .tx{flex:1;min-width:0}.vcard .tx b{display:block;font-size:20px;font-weight:400;margin-bottom:2px}.vcard .tx span{color:var(--dim)}
.vcard .res{margin-top:6px;font-size:14px}
.btn.big{font-size:16px;padding:10px 24px;border-radius:8px}
.msearch{width:100%;font:inherit;font-size:17px;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 18px;margin:14px 0}
.sect{color:var(--dim);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:6px 12px 4px}
.alist .ar{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.alist .ar:hover{background:var(--card)}
.alist .ar .tx{flex:1;min-width:0}.alist .ar .tx b{display:block;font-size:20px;font-weight:400}.alist .ar .tx span{color:var(--dim);font-size:15px}
.badge{min-width:30px;text-align:center;padding:2px 9px;border-radius:12px;font-size:14px;background:color-mix(in srgb,var(--err) 22%,transparent);color:var(--err)}
.badge.w{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.chev{color:var(--dim);font-size:24px;line-height:1}
.back{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:6px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto 150px auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.fr .tx b{display:block;font-weight:400;font-size:16px}
.fr .tx small{display:block;color:var(--dim);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.fr .val{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fr .st{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.fr .c input[type=number],.fr .c select{padding:5px 8px;font-size:13.5px;width:100%}
.fr .lnk{background:none;border:1px solid var(--line);color:var(--acc);border-radius:14px;font:inherit;font-size:13px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.vm{font-size:12px;padding:1px 7px;border-radius:9px}
.vm.y{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.vm.n{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.expl{color:var(--dim);font-size:15px;line-height:1.6;padding:12px}
.expl b{color:var(--txt);font-weight:500}
.pk2{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pk2:hover{background:var(--card2)}
.pk2 small{display:block;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
@media (max-width:760px){.sum{grid-template-columns:repeat(2,1fr)}.fr{grid-template-columns:minmax(0,1fr) auto}.fr .c,.fr .val{grid-column:1/-1;text-align:left}.vcard{flex-wrap:wrap}}
.tag{font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--card2);color:var(--dim);white-space:nowrap}
.tag.w{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
@media (max-width:760px){.etbl td.d,.etbl th.d,.etbl td.t,.etbl th.t{display:none}.etbl td.c{width:118px}.etbl td{padding:7px 8px}.etool .chip{font-size:12px;padding:3px 9px}}
.lhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.chip{font:inherit;font-size:13px;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sp{flex:1}
.lbody{max-height:460px;overflow:auto}
.lr{display:flex;gap:12px;padding:5px 16px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.35}
.lr .t{color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.lr .l{flex:none;width:14px;font-weight:700;text-align:center}
.lr .m{min-width:0;white-space:pre-wrap;word-break:break-word}
.lr .n{display:block;color:var(--dim);font-size:11.5px}
.lr.WARNING .l{color:var(--warn)}.lr.ERROR .l,.lr.CRITICAL .l,.lr.ERROR .m{color:var(--err)}.lr.DEBUG .m{color:var(--dim)}
.pk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:3px 16px;border-bottom:1px solid var(--line);word-break:break-all}
.empty{padding:16px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.dlg.on{display:flex}
.dlg .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);max-width:440px;width:100%;padding:18px}
.dlg h3{margin:0 0 8px;font-size:17px;font-weight:500}
.dlg p{margin:0 0 16px;color:var(--dim)}
.dlg .bb{display:flex;justify-content:flex-end;gap:10px}
.fatal{max-width:560px;margin:60px auto;padding:20px;text-align:center;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.sw input,.sw input::after,.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="fatal">Verbinde mit Home Assistant …</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="box"><h3 id="dlgT"></h3><p id="dlgP"></p>
  <div class="bb"><button class="btn" id="dlgN">Abbrechen</button><button class="btn pri" id="dlgY">OK</button></div></div></div>
<script>
/* EHS Panel – Verwaltung · Teil der Integration „Samsung EHS Panel“ */
const WS = 'samsung_ehs_panel/';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = (v,d=0) => v==null||isNaN(v) ? '–' : Number(v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const IC = {
  chip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>',
  plug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  ref:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>',
  pulse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  panel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>',
};

/* ---------- Home Assistant ---------- */
let hass = null;
function getHass(){ try{ const el = window.parent.document.querySelector('home-assistant'); return el && el.hass && el.hass.connection ? el.hass : null; }catch(e){ return null; } }
function applyTheme(){
  try{
    const el = window.parent.document.querySelector('home-assistant'); if(!el) return;
    const cs = getComputedStyle(el), root = document.documentElement.style, g = n => cs.getPropertyValue(n).trim();
    const map = {'--bg':'--primary-background-color','--card':'--card-background-color','--txt':'--primary-text-color','--dim':'--secondary-text-color',
                 '--acc':'--primary-color','--line':'--divider-color','--ok':'--success-color','--warn':'--warning-color','--err':'--error-color','--card2':'--secondary-background-color'};
    for(const [k,v] of Object.entries(map)){ const x = g(v); if(x) root.setProperty(k, x); }
    const dark = window.parent.matchMedia && el.hass && el.hass.themes ? !!el.hass.themes.darkMode : null;
    if(dark!=null) document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  }catch(e){}
}
const send = m => hass.connection.sendMessagePromise(m);
const callService = (d,s,data) => hass.callService(d,s,data);
function errText(e){ const c=e&&e.code, m=(e&&e.message)||String(e||'Fehler');
  if(c==='unknown_command') return 'Die Integration „Samsung EHS Panel“ ist veraltet – bitte auf Version 1.2 aktualisieren und HA neu starten.';
  if(c==='unauthorized') return 'Nur für Administratoren.'; return m; }

/* ---------- Zustand ---------- */
const st = { tab:(()=>{ try{ return sessionStorage.getItem('ehsm_tab')||'over'; }catch(e){ return 'over'; } })(),
             ent:{q:'', f:'all'},
             map:{view:'areas', area:null, f:'all', q:'', pick:null, pq:'', verify:null, verifying:false},
             cat:null, pmap:{}, pmapAdmin:true,
             status:null, err:null, sel:null, cfg:null, cfgFor:null, form:null, cfgMsg:null, busy:false,
             log:{tab:'log', level:'all', data:null, err:null, pause:false, file:null} };

async function loadStatus(){
  try{ st.status = await send({type:WS+'status'}); st.err=null;
       const ids = st.status.instances.map(x=>x.entry_id); if(!ids.includes(st.sel)) st.sel = ids[0]||null;
       if(st.sel && st.cfgFor!==st.sel) await loadCfg(); }
  catch(e){ st.err = errText(e); }
}
async function loadCfg(){
  try{ st.cfg = await send({type:WS+'config_get', entry_id:st.sel}); st.cfgFor = st.sel; st.form = {...st.cfg}; st.cfgMsg=null; }
  catch(e){ st.cfgMsg = {cls:'err', t:errText(e)}; }
}
async function loadLog(){
  const L = st.log; if(L.pause) return;
  try{
    L.data = L.tab==='log' ? await send({type:WS+'logs', level:L.level, limit:600})
                           : await send({type:WS+'packet_log', lines:300, ...(L.file?{file:L.file}:{})});
    L.err = null;
  }catch(e){ L.err = errText(e); }
}

/* ---------- Updates (HACS-Update-Entitäten) ---------- */
function updates(){
  const out = {ehs:null, panel:null};
  for(const [id,s] of Object.entries(hass.states)){
    if(!id.startsWith('update.')) continue;
    const t = `${s.attributes.title||''} ${s.attributes.friendly_name||''} ${id}`.toLowerCase();
    if(/samsung.?ehs.?panel|ehs.?sentinel.?panel/.test(t)) out.panel = {id, s};
    else if(/ehs.?sentinel/.test(t)) out.ehs = {id, s};
  }
  return out;
}

/* ---------- Entitäten (wie EMS-ESP Manager) ---------- */
function setTab(k){ st.tab=k; try{ sessionStorage.setItem('ehsm_tab',k); }catch(e){} if(k==='log'){ st.log.data=null; refreshLog(); } else render(); }
function ehsEntities(){
  const reg = hass.entities || {}, out = [];
  for(const [id,s] of Object.entries(hass.states)){
    const r = reg[id];
    const mine = r ? r.platform==='ehs_sentinel' : /ehssentinel/.test(id);
    if(!mine) continue;
    if(st.sel && r && r.config_entry_id && st.status && st.status.instances.length>1 && r.config_entry_id!==st.sel) continue;
    out.push({id, s, dom:id.split('.')[0], name:s.attributes.friendly_name||id});
  }
  return out.sort((a,b)=>a.name.localeCompare(b.name,'de'));
}
const EDIT = {number:1, select:1, switch:1};
const ENTF = [['all','Alle'],['edit','Einstellbar'],['sensor','Sensoren'],['binary_sensor','Binär'],['number','Zahlen'],['select','Auswahl'],['switch','Schalter'],['fsv','FSV'],['unav','Nicht verfügbar']];
function entFilter(list){
  const q = st.ent.q.trim().toLowerCase(), f = st.ent.f;
  return list.filter(e=>{
    if(f==='edit' && !EDIT[e.dom]) return false;
    if(['sensor','binary_sensor','number','select','switch'].includes(f) && e.dom!==f) return false;
    if(f==='fsv' && !/fsv/i.test(e.id+e.name)) return false;
    if(f==='unav' && !['unavailable','unknown'].includes(e.s.state)) return false;
    return !q || (e.name+' '+e.id).toLowerCase().includes(q);
  });
}
function valTxt(e){
  const s=e.s.state, u=e.s.attributes.unit_of_measurement||'';
  if(s==='unavailable') return 'nicht verfügbar'; if(s==='unknown') return '–';
  if(e.dom==='binary_sensor'||e.dom==='switch') return s==='on'?'Ein':'Aus';
  const n=parseFloat(s); if(!isNaN(n) && /^-?[\d.]+(e-?\d+)?$/i.test(s)) return n.toLocaleString('de-DE',{maximumFractionDigits:2})+(u?' '+u:'');
  return s+(u?' '+u:'');
}
function ctrlHtml(e){
  const a=e.s.attributes, s=e.s.state, dis = s==='unavailable' ? 'disabled' : '';
  if(e.dom==='number') return `<input type="number" data-eid="${esc(e.id)}" value="${esc(s)}" min="${esc(a.min??'')}" max="${esc(a.max??'')}" step="${esc(a.step??'any')}" ${dis} aria-label="${esc(e.name)}">`;
  if(e.dom==='select') return `<select data-eid="${esc(e.id)}" ${dis} aria-label="${esc(e.name)}">${(a.options||[]).map(o=>`<option ${o===s?'selected':''}>${esc(o)}</option>`).join('')}${(a.options||[]).includes(s)?'':`<option selected disabled>${esc(s)}</option>`}</select>`;
  if(e.dom==='switch') return `<label class="sw" style="justify-content:flex-end"><input type="checkbox" data-eid="${esc(e.id)}" ${s==='on'?'checked':''} ${dis} aria-label="${esc(e.name)}"></label>`;
  return '';
}
const ago = iso => { const d=(Date.now()-new Date(iso).getTime())/1000; return d<60?'gerade eben':d<3600?`vor ${Math.round(d/60)} min`:d<86400?`vor ${Math.round(d/3600)} h`:new Date(iso).toLocaleDateString('de-DE'); };
function entHtml(all){
  const list = entFilter(all);
  const chips = ENTF.map(([k,l])=>`<button class="chip ${st.ent.f===k?'on':''}" data-a="${act(()=>{ st.ent.f=k; render(); })}">${l}</button>`).join('');
  const rows = list.map(e=>`<tr data-row="${esc(e.id)}" class="${e.s.state==='unavailable'?'unav':''}">
      <td class="n">${esc(e.name)}<small>${esc(e.id)}</small></td>
      <td class="t"><span class="tag ${EDIT[e.dom]?'w':''}">${esc(e.dom)}</span></td>
      <td class="v" data-v="${esc(e.id)}">${esc(valTxt(e))}</td>
      <td class="c">${ctrlHtml(e)}</td>
      <td class="d" data-d="${esc(e.id)}">${esc(ago(e.s.last_changed))}</td></tr>`).join('');
  const wm = st.status && st.status.instances.find(x=>x.entry_id===st.sel);
  return `<div class="card">
    <div class="etool"><input type="search" id="eq" placeholder="Suchen (Name oder Entitäts-ID) …" value="${esc(st.ent.q)}" aria-label="Entitäten suchen">${chips}
      <span class="sp"></span><span style="color:var(--dim);font-size:13px">${list.length} von ${all.length}</span></div>
    ${wm && wm.write_mode===false ? `<div class="msg info" style="margin:12px 16px">Schreibmodus ist aus – EHS Sentinel legt Einstellwerte dann nur als Sensoren an. Einschalten unter Übersicht → Schnittstelle.</div>`:''}
    <div class="ewrap" id="ewrap">${list.length?`<table class="etbl"><thead><tr><th>Name / Entität</th><th class="t">Typ</th><th style="text-align:right">Wert</th><th>Ändern</th><th class="d">Geändert</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Keine passenden Entitäten.</div>'}</div></div>`;
}
function entLive(){   // Werte aktualisieren, ohne Eingaben zu stören
  for(const e of ehsEntities()){
    const v=document.querySelector(`[data-v="${CSS.escape(e.id)}"]`); if(!v) continue;
    const t=valTxt(e); if(v.textContent!==t){ v.textContent=t; const tr=v.parentElement; tr.classList.add('flash'); setTimeout(()=>tr.classList.remove('flash'),900); }
    const d=document.querySelector(`[data-d="${CSS.escape(e.id)}"]`); if(d) d.textContent=ago(e.s.last_changed);
    const c=document.querySelector(`[data-eid="${CSS.escape(e.id)}"]`);
    if(c && c!==document.activeElement){ if(c.type==='checkbox') c.checked=e.s.state==='on'; else if(c.value!==e.s.state && e.dom!=='number') c.value=e.s.state; else if(e.dom==='number' && parseFloat(c.value)!==parseFloat(e.s.state)) c.value=e.s.state; }
  }
}
function entBind(){
  const q=$('#eq'); if(q){ q.addEventListener('input',()=>{ st.ent.q=q.value; clearTimeout(entBind._t); entBind._t=setTimeout(()=>{ render(); const n=$('#eq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); }); }
  document.querySelectorAll('[data-eid]').forEach(el=>{
    const id=el.dataset.eid, dom=id.split('.')[0], s=hass.states[id];
    el.addEventListener('change',()=>{
      let p;
      if(dom==='number'){ const v=parseFloat(el.value), a=s.attributes;
        if(isNaN(v)){ toast('Bitte eine Zahl eingeben'); el.value=s.state; return; }
        if((a.min!=null && v<a.min) || (a.max!=null && v>a.max)){ toast(`Erlaubt: ${a.min} … ${a.max}`); el.value=hass.states[id].state; return; }
        p=callService('number','set_value',{entity_id:id,value:v}); }
      else if(dom==='select') p=callService('select','select_option',{entity_id:id,option:el.value});
      else if(dom==='switch') p=callService('switch',el.checked?'turn_on':'turn_off',{entity_id:id});
      if(p) p.then(()=>toast('Gesendet: '+(s.attributes.friendly_name||id))).catch(e=>{ toast(errText(e)); entLive(); });
    });
    if(dom==='number') el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') el.blur(); if(ev.key==='Escape'){ el.value=hass.states[id].state; el.blur(); } });
  });
}

  list:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 6h2v2H3zm4 0h14v2H7z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M10 18h4"/></svg>',
  slide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h18"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12c3-8 5-8 7 0s4 8 7 0 4-8 6-4"/></svg>',
  flow:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></svg>',
};
const objOf = id => (id.split('.')[1]||'').replace(/^.*?ehssentinel_/,'');
function grpOf(e, kind){
  const o = objOf(e.id);
  if(kind==='set'){ const m=o.match(/^infsv(\d)/); return m ? ({1:'FSV 10xx · Grenzwerte',2:'FSV 20xx · Heizkurve',3:'FSV 30xx · Warmwasser',4:'FSV 40xx · Heizung & Zuheizer',5:'FSV 50xx · Sonstiges'})[m[1]]||'FSV' : 'Betrieb'; }
  if(/^ehssentinel/.test(o)) return 'EHS Sentinel (berechnet)';
  if(/^(outdoor|out)/.test(o)) return 'Außengerät';
  if(/^(indoor|in|dhw|currenttemp|control|power|zone)/.test(o)) return 'Innengerät';
  return 'Weitere';
}
const GORD = ['Betrieb','FSV 10xx · Grenzwerte','FSV 20xx · Heizkurve','FSV 30xx · Warmwasser','FSV 40xx · Heizung & Zuheizer','FSV 50xx · Sonstiges','FSV','Innengerät','Außengerät','EHS Sentinel (berechnet)','Weitere'];
function labelOf(e){
  const o = objOf(e.id);
  if(st.cat){
    if(!labelOf.dup){ labelOf.dup={}; st.cat.forEach(f=>labelOf.dup[f.label]=(labelOf.dup[f.label]||0)+1); }
    const f = st.cat.find(f=>objOf(f.target)===o); if(f && labelOf.dup[f.label]===1) return f.label; }
  const fsv = o.match(/^infsv(\d{4})$/); if(fsv) return 'FSV '+fsv[1];
  const n = String(e.name).replace(/^.*?ehssentinel[ _]/i,'').replace(/([a-z])([A-Z0-9])/g,'$1 $2').replace(/_/g,' ');
  return n.charAt(0).toUpperCase()+n.slice(1);
}
function icoOf(e){
  const u = e.s.attributes.unit_of_measurement||'', o = objOf(e.id);
  if(e.dom==='switch'||e.dom==='binary_sensor') return e.dom==='binary_sensor' ? (e.s.state==='on'?MI.dot:MI.circ) : MI.phone;
  if(e.dom==='select') return MI.list;
  if(/°C|K$/.test(u)) return MI.therm;
  if(/W$|Wh$|kW|kWh/.test(u)) return MI.bolt;
  if(/^(min|h|s|d)$/.test(u) || /minute|time|hour/i.test(o)) return MI.clock;
  if(u==='%' ) return MI.gauge;
  if(/l\/min|flow/i.test(u+o)) return MI.flow;
  if(/hz|rpm/i.test(u)) return MI.wave;
  if(e.dom==='number') return MI.slide;
  return MI.eye;
}
const FSVU = { '°C':'1011 1012 1021 1022 1031 1032 1041 1042 1051 1052 2011 2012 2021 2022 2031 2032 2051 2052 2061 2062 2071 2072 3021 3044 4012 4013 4024 4025 5011 5012 5013 5014 5015 5016 5017 5018 5019 5021 5023',
  'K':'3022 3023 4042 4043 4052 5082 5083 5092 5093', 'min':'3024 3025 3032 3045 3052', 'h':'3026 3043 3046', 'kW':'3081 3082 3083' };
const FSVU_OF = {}; Object.entries(FSVU).forEach(([u,l])=>l.split(' ').forEach(n=>FSVU_OF['infsv'+n]=u));
function setCtl(e, lbl){
  const a=e.s.attributes, s=e.s.state, dis=s==='unavailable'?'disabled':'', u=a.unit_of_measurement||FSVU_OF[objOf(e.id)]||'';
  if(e.dom==='number') return `<div class="nbox"><input type="number" data-eid="${esc(e.id)}" value="${esc(s)}" min="${esc(a.min??'')}" max="${esc(a.max??'')}" step="${esc(a.step??'any')}" ${dis} aria-label="${esc(lbl)}">${u?`<span>${esc(u)}</span>`:''}</div>`;
  if(e.dom==='switch') return `<label class="sw"><input type="checkbox" data-eid="${esc(e.id)}" ${s==='on'?'checked':''} ${dis} aria-label="${esc(lbl)}"></label>`;
  return '';
}
function cardsHtml(ents, kind){
  const q = (st.cq||'').trim().toLowerCase();
  const list = ents.filter(e => kind==='set' ? EDIT[e.dom] : !EDIT[e.dom]).map(e=>({e, l:labelOf(e), g:grpOf(e,kind)}))
                   .filter(x => !q || (x.l+' '+x.e.id+' '+x.g).toLowerCase().includes(q));
  const groups = {}; list.forEach(x=>(groups[x.g]=groups[x.g]||[]).push(x));
  const keys = Object.keys(groups).sort((a,b)=>(GORD.indexOf(a)+1||99)-(GORD.indexOf(b)+1||99));
  const wm = st.status && st.status.instances.find(x=>x.entry_id===st.sel);
  const cards = keys.map(g=>`<div class="card"><h3>${esc(g)}</h3>${groups[g].sort((a,b)=>a.l.localeCompare(b.l,'de',{numeric:true})).map(({e,l})=>{
      const unav = e.s.state==='unavailable';
      if(kind==='set' && e.dom==='select') return `<div class="mr ${unav?'unav':''}"><span class="ico">${icoOf(e)}</span><div class="sbox"><label>${esc(l)}</label><select data-eid="${esc(e.id)}" ${unav?'disabled':''} aria-label="${esc(l)}">${(e.s.attributes.options||[]).map(o=>`<option value="${esc(o)}" ${o===e.s.state?'selected':''}>${esc(o)}</option>`).join('')}${(e.s.attributes.options||[]).includes(e.s.state)?'':`<option selected disabled>${esc(e.s.state)}</option>`}</select></div></div>`;
      const right = kind==='set' ? setCtl(e,l) : `<span class="vl" title="${esc(valTxt(e))}">${esc(valTxt(e))}</span>`;
      const on = e.dom==='switch' && e.s.state==='on';
      return `<div class="mr ${unav?'unav':''}"><span class="ico ${on?'on':''}">${icoOf(e)}</span><span class="nm">${esc(l)}<small>${esc(e.id)}</small></span>${right}</div>`;
    }).join('')}</div>`).join('');
  return `<div class="mtop"><input type="search" id="cq" placeholder="${kind==='set'?'Einstellung':'Messwert'} suchen …" value="${esc(st.cq||'')}" aria-label="Suchen"><span>${list.length} ${kind==='set'?'Einstellungen':'Messwerte'}</span></div>
    ${kind==='set' && wm && wm.write_mode===false ? `<div class="msg info" style="margin:0 0 16px">Schreibmodus ist aus – Einstellungen erscheinen dann nur unter Messwerte. Einschalten unter Übersicht → Schnittstelle.</div>`:''}
    ${list.length ? `<div class="mas">${cards}</div>` : '<div class="empty">Nichts gefunden.</div>'}`;
}
function cardsBind(){
  entBind();
  const q=$('#cq'); if(q) q.addEventListener('input',()=>{ st.cq=q.value; clearTimeout(cardsBind._t); cardsBind._t=setTimeout(()=>{ render(); const n=$('#cq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); });
}

/* ---------- Entitäten-Zuordnung (wie EMS-ESP Manager) ---------- */
const BAD = v => v==null || v==='unavailable' || v==='unknown';
const STL = {all:'Alle', found:'Gefunden', missing:'Fehlt in HA', nodata:'Nicht geliefert'};
async function loadMapData(){
  try{ const r = await fetch('ehs-functions.json?v='+Date.now()); st.cat = (await r.json()).functions || []; }catch(e){ st.cat = []; }
  try{ const r = await send({type:WS+'panel/get'}); st.pmap = r.map||{}; st.pmapAdmin = !!r.is_admin; }
  catch(e){ try{ st.pmap = JSON.parse(localStorage.getItem('ehs800.map')||'{}'); }catch(_){ st.pmap = {}; } }
}
function resolveT(t, ents){
  const cur = hass.states[t]; if(cur && !BAD(cur.state)) return t;
  const dom = t.split('.')[0], obj = (t.split('.')[1]||''), suf = 'ehssentinel_'+obj.replace(/^.*?ehssentinel_/,'');
  const c = ents.filter(e=>{ const o=e.id.split('.')[1]; return o===suf || o.endsWith('_'+suf); });
  c.sort((a,b)=>(BAD(a.s.state)-BAD(b.s.state)) || ((a.dom!==dom)-(b.dom!==dom)));
  return c.length ? c[0].id : (cur ? t : null);
}
function fnInfo(f, ents){
  const ov = f.ids.map(i=>st.pmap[i]).find(Boolean);
  const t = ov || f.target, r = resolveT(t, ents), s = r && hass.states[r];
  const status = !r ? 'missing' : BAD(s.state) ? 'nodata' : 'found';
  const v = st.map.verify; const vm = !v || !r ? null : v.answered.has(r) ? 'y' : v.missing.has(r) ? 'n' : null;
  return {f, t, r, s, status, over:!!ov, vm};
}
function mapHtml(ents){
  if(!st.cat) return `<div class="empty">Lade Funktionsliste …</div>`;
  const M = st.map, all = st.cat.map(f=>fnInfo(f, ents));
  const cnt = k => k==='all' ? all.length : all.filter(x=>x.status===k).length;
  const q = M.q.trim().toLowerCase();
  const pass = x => (M.f==='all' || x.status===M.f) && (!q || (x.f.label+' '+(x.r||x.t)+' '+x.f.area).toLowerCase().includes(q));
  const sumBtn = (k,cls) => `<button class="${cls} ${M.f===k?'on':''}" data-a="${act(()=>{ M.f=k; render(); })}"><b>${cnt(k)}</b>${STL[k]}</button>`;
  const v = M.verify;
  const vres = M.verifying ? `<div class="res" style="color:var(--dim)">Werte werden bei der Wärmepumpe angefragt … (bis zu 20 s)</div>`
    : v ? `<div class="res"><span style="color:var(--ok)">✓ ${v.answered.size} antworten</span> · <span style="color:var(--warn)">✗ ${v.missing.size} ohne Antwort</span>${v.noKey?` · ${v.noKey} nicht anfragbar`:''} <span style="color:var(--dim)">(${v.time})</span>${v.errors.length?`<br><span style="color:var(--err)">${esc(v.errors.join(' '))}</span>`:''}</div>` : '';
  let html = `<div class="mapw"><h1>Entitäten-Zuordnung</h1><div class="bar"></div>
    <div class="sum">${sumBtn('all','')}${sumBtn('found','g')}${sumBtn('missing','m')}${sumBtn('nodata','x')}</div>
    <div class="card vcard"><div class="tx"><b>Werte prüfen</b><span>Fragt alle Werte direkt bei der Wärmepumpe ab und prüft, ob Home Assistant sie erhält. Es wird nichts verändert.</span>${vres}</div>
      <button class="btn pri big" data-a="${act(runVerify)}" ${M.verifying?'disabled':''}>${M.verifying?'Prüfe …':'Prüfen'}</button></div>`;
  if(M.view==='pick') return html.replace('<h1>Entitäten-Zuordnung</h1><div class="bar"></div>','<h1>Zuordnen</h1><div class="bar"></div>').split('<div class="sum">')[0] + pickHtml(ents, all) + `</div>`;
  if(M.view==='area' && !q){
    const rows = all.filter(x=>x.f.area===M.area && pass(x));
    html += `<button class="back" data-a="${act(()=>{ M.view='areas'; render(); })}">‹ Bereiche</button>
      <div class="sect">${esc(M.area)} · ${esc(STL[M.f])}</div><div class="card">${rows.map(fnRow).join('') || '<div class="empty">Keine Funktionen in diesem Filter.</div>'}</div>`;
  } else {
    html += `<input type="search" class="msearch" id="mq" placeholder="Funktion oder Entität suchen …" value="${esc(M.q)}" aria-label="Funktion oder Entität suchen">`;
    if(q){
      const rows = all.filter(pass);
      html += `<div class="sect">Treffer · ${rows.length}</div><div class="card">${rows.map(fnRow).join('') || '<div class="empty">Nichts gefunden.</div>'}</div>`;
    } else {
      const areas = [...new Set(st.cat.map(f=>f.area))];
      const rows = areas.map(a=>{ const it = all.filter(x=>x.f.area===a); if(!it.some(pass)) return '';
        const g=it.filter(x=>x.status==='found').length, m=it.filter(x=>x.status==='missing').length, n=it.filter(x=>x.status==='nodata').length;
        const vn = v ? it.filter(x=>x.vm==='n').length : 0;
        return `<div class="ar" data-a="${act(()=>{ M.view='area'; M.area=a; render(); })}" role="button" tabindex="0"><div class="tx"><b>${esc(a)}</b>
          <span>${g} von ${it.length} gefunden${m?` · ${m} fehlt in HA`:''}${n?` · ${n} nicht geliefert`:''}${vn?` · ${vn} ohne Antwort`:''}</span></div>
          ${m?`<span class="badge">${m}</span>`:vn?`<span class="badge w">${vn}</span>`:''}<span class="chev">›</span></div>`; }).join('');
      html += `<div class="sect">Bereiche · ${esc(STL[M.f])}</div><div class="alist">${rows || '<div class="empty">Keine Bereiche in diesem Filter.</div>'}</div>`;
    }
  }
  html += `<div class="expl"><b>Fehlt in HA</b> – das Panel nutzt die Funktion, aber Home Assistant hat keine passende Entität von EHS Sentinel. Antippen und zuordnen.<br>
    <b>Nicht geliefert</b> – die Entität existiert, die Wärmepumpe liefert aber keinen Wert (z. B. Zone 2, Zubehör). Das Panel blendet sie aus, hier ist nichts zu tun.<br>
    <b>Werte prüfen</b> – „ohne Antwort“ heißt: die WP hat auf die Anfrage nicht reagiert (Funktion bei diesem Modell nicht vorhanden oder Verbindung gestört).<br>
    Eigene Zuordnungen werden in Home Assistant gespeichert und gelten für das Samsung-Panel in jedem Browser.</div>
    <div style="text-align:center;margin:10px 0 20px"><button class="btn" data-a="${act(()=>{ M.view='raw'; render(); })}">Alle EHS-Sentinel-Entitäten anzeigen (${ents.length})</button></div></div>`;
  return html;
}
function fnRow(x){
  const e = x.r ? {id:x.r, s:x.s, dom:x.r.split('.')[0], name:x.f.label} : null;
  const pill = x.status==='found' ? '<span class="pill ok">Gefunden</span>' : x.status==='missing' ? '<span class="pill no">Fehlt in HA</span>' : '<span class="pill dm" style="color:var(--dim);background:var(--card2)">Nicht geliefert</span>';
  const vm = x.vm==='y' ? '<span class="vm y">✓ antwortet</span>' : x.vm==='n' ? '<span class="vm n">✗ keine Antwort</span>' : '';
  return `<div class="fr"><div class="tx"><b>${esc(x.f.label)}</b><small>${x.r?esc(x.r):'keine Entität · erwartet '+esc(x.t)}${x.over?' · eigene Zuordnung':''}</small></div>
    <div class="st">${pill}${vm}</div>
    <div class="c">${e && x.status==='found' && EDIT[e.dom] ? ctrlHtml(e) : `<div class="val">${e?esc(valTxt(e)):'–'}</div>`}</div>
    <button class="lnk" data-a="${act(()=>{ st.map.pick=x.f; st.map.pq=''; st.map.view='pick'; render(); })}">${x.status==='missing'?'Zuordnen':'Ändern'}</button></div>`;
}
function pickHtml(ents, all){
  const M = st.map, f = M.pick, x = all.find(y=>y.f===f) || fnInfo(f, ents), q = M.pq.trim().toLowerCase();
  const list = ents.filter(e=>!q || (e.name+' '+e.id).toLowerCase().includes(q)).slice(0,300);
  return `<button class="back" data-a="${act(()=>{ M.view = M.area?'area':'areas'; render(); })}">‹ Zurück</button>
    <div class="card pad"><b style="font-size:18px;font-weight:400">${esc(f.label)}</b><div style="color:var(--dim);font-size:13.5px;margin-top:4px">
      Bereich: ${esc(f.area)} · Standard: <code>${esc(f.target)}</code><br>Aktuell: ${x.r?`<code>${esc(x.r)}</code>`:'keine Entität'}${x.over?' (eigene Zuordnung)':''}</div>
      ${x.over?`<div style="margin-top:10px"><button class="btn" data-a="${act(()=>saveMapFor(f,null))}">Standard wiederherstellen</button></div>`:''}</div>
    <input type="search" class="msearch" id="pq" placeholder="EHS-Sentinel-Entität suchen …" value="${esc(M.pq)}" aria-label="Entität suchen">
    <div class="card">${list.map(e=>`<div class="pk2" data-a="${act(()=>saveMapFor(f,e.id))}" role="button" tabindex="0"><div>${esc(e.name)}<small>${esc(e.id)}</small></div><div class="val" style="white-space:nowrap">${esc(valTxt(e))}</div></div>`).join('') || '<div class="empty">Keine Entität gefunden.</div>'}</div>`;
}
async function saveMapFor(f, eid){
  const m = {...st.pmap}; for(const id of f.ids){ if(eid) m[id]=eid; else delete m[id]; }
  try{ await send({type:WS+'panel/save', map:m}); st.pmap = m; try{ localStorage.setItem('ehs800.map', JSON.stringify(m)); }catch(e){}
       toast(eid ? 'Zugeordnet – gilt sofort im Samsung-Panel (Seite dort neu laden)' : 'Standard wiederhergestellt'); st.map.view = st.map.area?'area':'areas'; render(); }
  catch(e){ toast(errText(e)); }
}
async function runVerify(){
  const M = st.map, ents = ehsEntities(); if(!st.cat) return;
  const ids = [...new Set(st.cat.map(f=>fnInfo(f, ents).r).filter(Boolean))];
  M.verifying = true; render();
  try{ const r = await send({type:WS+'verify', entity_ids:ids, entry_id:st.sel||undefined, timeout:20});
       M.verify = {answered:new Set(r.answered), missing:new Set(r.missing), noKey:(r.no_key||[]).length, errors:r.errors||[], time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}; }
  catch(e){ toast(errText(e)); }
  M.verifying = false; render();
}
function mapBind(){
  const q = $('#mq'); if(q) q.addEventListener('input',()=>{ st.map.q=q.value; clearTimeout(mapBind._t); mapBind._t=setTimeout(()=>{ render(); const n=$('#mq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); });
  const p = $('#pq'); if(p) p.addEventListener('input',()=>{ st.map.pq=p.value; clearTimeout(mapBind._t); mapBind._t=setTimeout(()=>{ render(); const n=$('#pq'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); });
  document.querySelectorAll('.ar[data-a],.pk2[data-a]').forEach(el=>el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); el.click(); } }));
}

/* ---------- Aktionen ---------- */
function openHA(path){ try{ window.parent.history.pushState(null,'',path); window.parent.dispatchEvent(new CustomEvent('location-changed')); }catch(e){ window.open(path,'_top'); } }
async function testConn(){
  const f = st.form; if(!f.ip || !f.port){ st.cfgMsg={cls:'err',t:'IP und Port eintragen.'}; render(); return; }
  st.busy=true; st.cfgMsg={cls:'info',t:`Teste ${f.ip}:${f.port} …`}; render();
  try{ const r = await send({type:WS+'test_connection', ip:String(f.ip).trim(), port:+f.port});
       st.cfgMsg = r.ok ? {cls:'ok',t:`Verbindung OK (${r.ms} ms) – ${f.ip}:${f.port} ist erreichbar.`} : {cls:'err',t:`Keine Verbindung zu ${f.ip}:${f.port}: ${r.error}`}; }
  catch(e){ st.cfgMsg={cls:'err',t:errText(e)}; }
  st.busy=false; render();
}
function saveCfg(){
  const f = st.form;
  confirmDo('Schnittstelle speichern', `Einstellungen für „${f.name||'EHS Sentinel'}“ speichern? Die Verbindung wird getestet und EHS Sentinel neu geladen.`, async()=>{
    st.busy=true; st.cfgMsg={cls:'info',t:'Speichere und verbinde neu …'}; render();
    const values = {}; for(const k of ['ip','port','write_mode','polling','polling_yaml','extended_logging','force_refresh','diagnostic_logs']) values[k]=f[k];
    values.ip = String(values.ip||'').trim();
    try{ const r = await send({type:WS+'config_set', entry_id:st.sel, values});
         st.cfgMsg = r.ok ? {cls:'ok',t:'Gespeichert – EHS Sentinel wurde neu geladen.'} : {cls:'err',t:r.error};
         if(r.ok){ st.cfgFor=null; await loadStatus(); } }
    catch(e){ st.cfgMsg={cls:'err',t:errText(e)}; }
    st.busy=false; render();
  });
}
function copyLog(){
  const L=st.log; if(!L.data) return;
  const text = L.tab==='log' ? (L.data.entries||[]).map(e=>`${new Date(e.ts*1000).toLocaleString('de-DE')} ${e.level} ${e.name}: ${e.msg}`).join('\n') : (L.data.lines||[]).join('\n');
  const done = () => toast('In die Zwischenablage kopiert');
  const fb = () => { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Kopieren nicht möglich'); } ta.remove(); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fb); else fb();
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2600); }
function confirmDo(title,text,yes){
  const d=$('#dlg'); $('#dlgT').textContent=title; $('#dlgP').textContent=text; d.classList.add('on'); $('#dlgY').focus();
  const close=()=>{ d.classList.remove('on'); $('#dlgY').onclick=$('#dlgN').onclick=null; };
  $('#dlgN').onclick=close; $('#dlgY').onclick=()=>{ close(); yes(); };
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#dlg').classList.remove('on'); });

/* ---------- Ablauf ---------- */
async function refreshLog(){ await loadLog(); render(); }
async function refreshAll(){ await loadStatus(); if(st.tab==='log') await loadLog(); render(); }
function editing(){ const a=document.activeElement; return !!a && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName); }
async function start(){
  for(let i=0;i<40 && !(hass=getHass()); i++) await new Promise(r=>setTimeout(r,150));
  applyTheme();
  if(!hass){ render(); return; }
  await loadMapData();
  await refreshAll();
  setInterval(async()=>{ if(document.hidden) return; hass = getHass()||hass; await loadStatus();
    if(st.tab==='ent'){ if(st.map.view==='raw') entLive(); else if(!editing()) render(); return; }
    if(st.tab==='set'||st.tab==='mes'){ if(!editing()) render(); return; }
    if(st.tab==='log') await loadLog();
    if(!editing()) render(); }, 4000);
  setInterval(()=>{ if(st.tab==='ent' && st.map.view==='raw' && !document.hidden){ hass=getHass()||hass; entLive(); } }, 1500);
}
start();
