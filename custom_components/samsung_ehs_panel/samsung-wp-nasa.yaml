# Samsung EHS – ESPHome (Beormund/esphome-samsung-nasa) – erzeugt für das „Samsung EHS Panel“
# Alle Namen sind so gewählt, dass das Panel die Entitäten automatisch findet. Namen bitte nicht ändern.
# Indoor = nasa_device_1 (20.00.00), Outdoor = nasa_device_2 (10.00.00)
# Import external component from GitHub
external_components:
  - source: github://beormund/esphome-samsung-nasa@main
    components: [samsung_nasa]

esphome:
  name: samsung-wp-nasa
  friendly_name: Samsung WP
  min_version: 2026.5.0

esp32:
  board: m5stack-atom
  framework:
    # Arduino framework has faster compilation but 
    # uses more RAM and Flash; ESP-IDF framework has 
    # slower compilation but uses less RAM and FLash
    type: esp-idf
    # type: arduino

# Enable logging
logger:
  logs:
    component: ERROR

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: web_server
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Set up a wifi access point
  ap: {}

# In combination with the ap: this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

# This creates a HA style local web page 
web_server:
  port: 80
  version: 3
  log: true
  local: true

# Specify pins used by the board to communicate over RS485
uart:
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 9600
  parity: EVEN

## SAMSUNG NASA CONFIGURATION
